<!doctype html>
<html lang="zh-CN" data-theme="light" data-layout="wide">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看板 · DSH · 设计稿</title>
<script>
  /* 首帧防闪：仅演示用；真实插件由宿主 ui-theme 决定主题与主区宽度 */
  (function () {
    var p = new URLSearchParams(location.search);
    var dark = p.get('theme') ? p.get('theme') === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    var w = window.innerWidth;
    document.documentElement.dataset.layout = w < 720 ? 'narrow' : w < 1100 ? 'scroll' : w < 1440 ? 'compact' : 'wide';
  })();
</script>

    --ds-ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
    --dsw-elevation-panel: 0 0 0 0.5px rgba(0, 0, 0, 0.16), 0 3px 8px 0 rgba(0, 0, 0, 0.03), 0 0 16px 0 rgba(0, 0, 0, 0.02);
    --dsw-elevation-prominent: 0 0 0 0.5px rgba(0, 0, 0, 0.16), 0 3px 8px 0 rgba(0, 0, 0, 0.04), 0 0 20px 0 rgba(0, 0, 0, 0.05);
    --dsw-elevation-soft: 0 0 0 0.5px rgba(0, 0, 0, 0.16), 0 4px 16px 0 rgba(0, 0, 0, 0.03), 0 0 24px 0 rgba(0, 0, 0, 0.03);

    --dsw-alias-label-primary: rgb(15, 17, 21);
    --dsw-alias-label-secondary: rgb(97, 102, 107);
    --dsw-alias-label-tertiary: rgb(129, 133, 140);
    --dsw-alias-label-caption: rgb(173, 178, 184);
    --dsw-alias-label-dimmed: rgb(225, 229, 238);
    --dsw-alias-label-primary-foreground: rgb(255, 255, 255);
    --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
    --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
    --dsw-alias-border-l3: rgba(0, 0, 0, 0.12);
    --dsw-alias-border-l4: rgba(0, 0, 0, 0.16);
    --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
    --dsw-alias-interactive-bg-active: rgba(38, 49, 72, 0.1);
    --dsw-alias-interactive-bg-hover-solid: rgb(241, 243, 245);

    --dsw-alias-button-primary-fill: rgb(15, 17, 21);

    --dsw-alias-button-ghost-active-fill: rgb(235, 238, 242);
    --dsw-alias-button-ghost-active-border: rgb(151, 157, 166);
    --dsw-alias-button-elevated-fill: rgb(255, 255, 255);
    --dsw-alias-link: rgb(65, 118, 230);
    --dsw-specific-sidebar-fill: rgb(249, 250, 251);
    --dsw-specific-sidebar-nav-item-active: rgb(235, 238, 242);
    --dsw-specific-sidebar-nav-item-hover: rgb(241, 243, 245);
    --dsw-specific-menu: rgb(255, 255, 255);

  html[data-theme="dark"] {

    --dsw-alias-bg-base: rgb(21, 21, 23);

    --dsw-alias-bg-layer-3: rgb(53, 54, 56);

    --dsw-alias-bg-skeleton: rgba(255, 255, 255, 0.08);
    --dsw-alias-bg-mask-2: rgba(0, 0, 0, 0.2);
    --dsw-alias-label-primary: rgb(249, 250, 251);
    --dsw-alias-label-secondary: rgb(207, 211, 214);
    --dsw-alias-label-tertiary: rgb(173, 178, 184);
    --dsw-alias-label-caption: rgb(129, 133, 140);
    --dsw-alias-label-dimmed: rgb(67, 69, 74);

    --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
    --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
    --dsw-alias-border-l3: rgba(255, 255, 255, 0.16);
    --dsw-alias-border-l4: rgba(255, 255, 255, 0.2);
    --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);

    --dsw-alias-interactive-bg-hover-solid: rgb(53, 54, 56);
    --dsw-alias-interactive-bg-hover-danger: rgba(242, 90, 90, 0.15);
    --dsw-alias-state-error-primary: rgb(242, 90, 90);
    --dsw-alias-state-warn-tertiary: rgb(39, 36, 31);
    --dsw-alias-state-success-tertiary: rgb(35, 60, 44);
    --dsw-alias-state-business-primary: rgb(103, 158, 254);
    --dsw-alias-state-business-tertiary: rgb(52, 65, 91);
    --dsw-alias-button-primary-fill: rgb(249, 250, 251);
    --dsw-alias-button-primary-hover: rgb(235, 238, 242);
    --dsw-alias-button-primary-dimmed: rgb(67, 69, 74);
    --dsw-alias-button-ghost-active-fill: rgb(67, 69, 74);
    --dsw-alias-button-ghost-active-border: rgb(129, 133, 140);
    --dsw-alias-button-elevated-fill: rgb(67, 69, 74);
    --dsw-alias-link: rgb(103, 158, 254);
    --dsw-specific-sidebar-fill: rgb(27, 27, 28);
    --dsw-specific-sidebar-nav-item-active: rgb(67, 69, 74);
    --dsw-specific-sidebar-nav-item-hover: rgb(44, 44, 46);
    --dsw-specific-menu: rgb(53, 54, 56);
    --dsw-specific-input-major: rgb(44, 44, 46);
    --dsw-specific-selector: rgb(53, 54, 56);

<!-- =========================================================================
     看板组件样式：只消费 --dsw-alias-* / --dsw-font-* / elevation / legacy motion
     机械规则：0.5px 中性实线；浮层 border:0 + elevation；全圆配 corner-shape:round
     ========================================================================= -->
<style id="kanban-styles">
  *, *::before, *::after {
    box-sizing: border-box;
    corner-shape: superellipse(1.5);
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xs-13);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  [hidden] { display: none !important; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  h1, h2, h3, p, ol, dl, dd, dt { margin: 0; }
  :focus-visible {
    outline: 2px solid var(--dsw-alias-state-business-primary);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  .ic { width: 16px; height: 16px; display: block; flex: none; }

  /* ------------------------------------------------------------------ shell */
  .app {
    --kb-rail-w: 52px;
    --kb-r-card: 12px;
    --kb-r-col: 14px;
    --kb-r-ctl: 8px;
    --kb-gap: 16px;
    --kb-pad-x: 20px;
    --kb-ease-out: cubic-bezier(0.22, 1, 0.36, 1);

    /* 看板语义 → 真实 DSH alias 令牌（对应 docs/03-design-system.md 映射表） */
    --kb-status-backlog: var(--dsw-alias-label-caption);
    --kb-status-running: var(--dsw-alias-state-business-primary);
    --kb-status-needs: var(--dsw-alias-state-warn-primary);
    --kb-status-needs-text: var(--dsw-alias-state-warn-label);
    --kb-status-done: var(--dsw-alias-state-success-primary);
    --kb-status-blocked: var(--dsw-alias-state-error-primary);
    --kb-status-failed: var(--dsw-alias-state-error-primary);
    --kb-agent-active: var(--dsw-alias-state-business-primary);
    --kb-surface-column: color-mix(in srgb, var(--dsw-alias-label-primary) 3%, var(--dsw-alias-bg-base));
    --kb-surface-card: var(--dsw-alias-bg-layer-1);
    --kb-hairline: var(--dsw-alias-border-l2);

    position: relative;
    display: grid;
    grid-template-columns: var(--kb-rail-w) minmax(0, 1fr);
    height: 100dvh;
    overflow: hidden;
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xs-13);
  }

  .rail {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 10px 0 12px;
    background: var(--dsw-specific-sidebar-fill);
    border-right: 0.5px solid var(--dsw-alias-border-l2);
  }
  .rail-logo {
    width: 30px;
    height: 30px;
    margin-bottom: 6px;
    display: grid;
    place-items: center;
    border-radius: 9px;
    background: var(--dsw-alias-button-primary-fill);
    color: var(--dsw-alias-label-primary-foreground);
    font: var(--dsw-font-xs-strong-13);
    letter-spacing: -0.03em;
  }
  .rail-btn {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--dsw-alias-label-tertiary);
    cursor: pointer;
    transition: background-color var(--ds-transition-duration-fast) var(--ds-ease-in-out), color var(--ds-transition-duration-fast) var(--ds-ease-in-out);
  }
  .rail-btn:hover { background: var(--dsw-specific-sidebar-nav-item-hover); color: var(--dsw-alias-label-primary); }
  .rail-btn.is-active { background: var(--dsw-specific-sidebar-nav-item-active); color: var(--dsw-alias-label-primary); }
  .rail-spacer { flex: 1; }
  .rail-avatar {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    corner-shape: round;
    background: var(--dsw-alias-state-business-tertiary);
    color: var(--dsw-alias-state-business-primary);
    display: grid;
    place-items: center;
    font: var(--dsw-font-xxs-strong-12);
  }

  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--dsw-alias-bg-base);
  }

  /* ----------------------------------------------------------------- topbar */
  .topbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    padding: 0 var(--kb-pad-x);
    border-bottom: 0.5px solid var(--dsw-alias-border-l2);
  }
  .crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .crumb { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xs-13); white-space: nowrap; }
  .crumb-sep { color: var(--dsw-alias-label-caption); }
  .crumb-current { color: var(--dsw-alias-label-primary); font: var(--dsw-font-xs-strong-13); white-space: nowrap; }
  .crumb-tag {
    margin-left: 4px;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--dsw-alias-state-business-tertiary);
    color: var(--dsw-alias-state-business-primary);
    font: var(--dsw-font-xxxs-strong-11);
  }
  .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  .seg {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 2px;
    border-radius: 10px;
    background: var(--dsw-specific-selector);
  }
  .seg-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxs-strong-12);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color var(--ds-transition-duration-fast) var(--ds-ease-in-out), color var(--ds-transition-duration-fast) var(--ds-ease-in-out);
  }
  .seg-btn:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .seg-btn.is-active {
    background: var(--dsw-alias-button-ghost-active-fill);
    color: var(--dsw-alias-label-primary);
    box-shadow: var(--dsw-shadow-lv1);
  }

  /* ----------------------------------------------------------------- button */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xxs-strong-12);
    cursor: pointer;
    white-space: nowrap;
    transition: background-color var(--ds-transition-duration-fast) var(--ds-ease-in-out), color var(--ds-transition-duration-fast) var(--ds-ease-in-out), border-color var(--ds-transition-duration-fast) var(--ds-ease-in-out);
  }
  .btn:focus-visible { outline-offset: 2px; }
  .btn-primary {
    height: 34px;
    padding: 0 14px;
    background: var(--dsw-alias-button-primary-fill);
    color: var(--dsw-alias-label-primary-foreground);
  }
  .btn-primary:hover { background: var(--dsw-alias-button-primary-hover); }
  .btn-primary:active { background: var(--dsw-alias-button-primary-hover); }
  .btn-secondary {
    background: var(--dsw-alias-bg-layer-1);
    border: 0.5px solid var(--dsw-alias-border-l2);
  }
  .btn-secondary:hover { background: var(--dsw-alias-interactive-bg-hover-solid); }
  .btn-ghost { color: var(--dsw-alias-label-secondary); }
  .btn-ghost:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .btn-danger { color: var(--dsw-alias-state-error-primary); }
  .btn-danger:hover { background: var(--dsw-alias-interactive-bg-hover-danger); }
  .btn-sm { height: 28px; padding: 0 10px; }
  .btn .btn-en {
    font: var(--dsw-font-xxxs-11);
    letter-spacing: 0.02em;
    color: var(--dsw-alias-label-tertiary);
  }
  .btn-primary .btn-en { color: var(--dsw-alias-label-primary-foreground); opacity: 0.7; }
  .btn-text { display: inline; }

  .icon-btn {
    width: 28px;
    height: 28px;
    flex: none;
    display: inline-grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--dsw-alias-label-tertiary);
    cursor: pointer;
    transition: background-color var(--ds-transition-duration-fast) var(--ds-ease-in-out), color var(--ds-transition-duration-fast) var(--ds-ease-in-out);
  }
  .icon-btn:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .icon-btn:active { background: var(--dsw-alias-interactive-bg-active); }
  .icon-btn.is-on { color: var(--dsw-alias-label-primary); background: var(--dsw-alias-interactive-bg-hover); }

  .kbd {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 4px;
    color: var(--dsw-alias-label-caption);
    font: var(--dsw-font-xxxs-11);
    font-variant-numeric: tabular-nums;
  }

  /* ---------------------------------------------------------------- toolbar */
  .toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px var(--kb-pad-x);
    border-bottom: 0.5px solid var(--dsw-alias-border-l1);
  }
  .search {
    display: flex;
    align-items: center;
    gap: 6px;
    width: clamp(180px, 26vw, 300px);
    height: 32px;
    padding: 0 6px 0 10px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 8px;
    background: var(--dsw-specific-input-major);
    transition: border-color var(--ds-transition-duration-fast) var(--ds-ease-in-out);
  }
  .search:hover { border-color: var(--dsw-alias-border-l3); }
  .search:focus-within { outline: 2px solid var(--dsw-alias-state-business-primary); outline-offset: 1px; }
  .search .ic { color: var(--dsw-alias-label-caption); }
  .search input {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xs-13);
  }
  .search input::placeholder { color: var(--dsw-alias-label-caption); }
  .search-clear { width: 20px; height: 20px; border-radius: 5px; }
  .search-clear .ic { width: 13px; height: 13px; }

  .filter-btn { height: 32px; }
  .filter-btn .ic { width: 14px; height: 14px; }
  .filter-count {
    min-width: 16px;
    height: 16px;
    padding: 0 4px;
    border-radius: 5px;
    background: var(--dsw-alias-state-business-tertiary);
    color: var(--dsw-alias-state-business-primary);
    font: var(--dsw-font-xxxs-strong-11);
    display: inline-grid;
    place-items: center;
  }
  .filter-chips { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; }
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 22px;
    padding: 0 6px;
    border: 0;
    border-radius: 5px;
    background: var(--dsw-alias-interactive-bg-hover);
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxxs-11);
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-chip:hover { background: var(--dsw-alias-interactive-bg-active); color: var(--dsw-alias-label-primary); }
  .filter-chip .ic { width: 11px; height: 11px; }
  .toolbar-spacer { flex: 1; }

  .agent-live {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--dsw-alias-label-tertiary);
    font: var(--dsw-font-xxxs-11);
    white-space: nowrap;
  }
  .agent-live .dot { color: var(--kb-agent-active); }
  .agent-live strong { color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxxs-strong-11); }

  /* ------------------------------------------------------------ column tabs */
  .col-tabs {
    display: none;
    flex: none;
    gap: 2px;
    padding: 8px 12px;
    border-bottom: 0.5px solid var(--dsw-alias-border-l1);
  }
  .col-tab {
    flex: 1 1 0;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    height: 36px;
    padding: 0 4px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxs-strong-12);
    cursor: pointer;
  }
  .col-tab .dot { width: 7px; height: 7px; }
  .col-tab.is-active { background: var(--dsw-specific-selector); color: var(--dsw-alias-label-primary); }
  .col-tab-count { color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); font-variant-numeric: tabular-nums; }

  /* ------------------------------------------------------------------ board */
  .board-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .board {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(280px, 1fr));
    grid-template-rows: minmax(0, 1fr);
    gap: var(--kb-gap);
    padding: 16px var(--kb-pad-x) 20px;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .column {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-radius: var(--kb-r-col);
    background: var(--kb-surface-column);
    border: 0.5px solid var(--dsw-alias-border-l1);
  }
  .column[data-tone="needs"] { background: color-mix(in srgb, var(--kb-status-needs) 5%, var(--kb-surface-column)); }
  .column[data-tone="running"] { background: color-mix(in srgb, var(--kb-status-running) 3%, var(--kb-surface-column)); }
  .column.is-drop-target { background: color-mix(in srgb, var(--kb-status-running) 9%, var(--kb-surface-column)); }

  .column-head { flex: none; display: flex; align-items: center; gap: 6px; padding: 10px 8px 8px 12px; }
  .col-icon { display: grid; place-items: center; color: var(--kb-status-backlog); }
  .col-icon .ic { width: 17px; height: 17px; }
  .column[data-tone="running"] .col-icon { color: var(--kb-status-running); }
  .column[data-tone="needs"] .col-icon { color: var(--kb-status-needs); }
  .column[data-tone="done"] .col-icon { color: var(--kb-status-done); }
  .col-title {
    display: flex;
    align-items: baseline;
    gap: 6px;
    min-width: 0;
    font: var(--dsw-font-xs-strong-13);
    color: var(--dsw-alias-label-primary);
  }
  .col-en {
    font: var(--dsw-font-xxxs-strong-11);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--dsw-alias-label-caption);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .count-pill {
    flex: none;
    min-width: 20px;
    height: 18px;
    padding: 0 6px;
    display: inline-grid;
    place-items: center;
    border-radius: 99px;
    corner-shape: round;
    background: color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent);
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxxs-strong-11);
    font-variant-numeric: tabular-nums;
  }
  .col-head-actions { margin-left: auto; display: flex; align-items: center; gap: 0; }
  .col-head-actions .icon-btn { width: 24px; height: 24px; }
  .col-head-actions .ic { width: 14px; height: 14px; }

  .column-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 0 10px 4px;
  }
  .column-add {
    flex: none;
    display: flex;
    align-items: center;
    gap: 5px;
    width: calc(100% - 20px);
    margin: 4px 10px 10px;
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--dsw-alias-label-tertiary);
    font: var(--dsw-font-xxs-12);
    cursor: pointer;
    text-align: left;
  }
  .column-add:hover { background: var(--dsw-alias-interactive-bg-hover); color: var(--dsw-alias-label-primary); }
  .column-add .ic { width: 13px; height: 13px; }
  .column-collapsed {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 16px;
    color: var(--dsw-alias-label-tertiary);
    font: var(--dsw-font-xxs-12);
    text-align: center;
  }
  .column-collapsed span { color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }

  /* ------------------------------------------------------------------- card */
  .card {
    position: relative;
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 10px 9px;
    border-radius: var(--kb-r-card);
    border: 0.5px solid var(--dsw-alias-border-l2);
    background: var(--kb-surface-card);
    cursor: pointer;
    transition: background-color var(--ds-transition-duration-fast) var(--ds-ease-in-out), border-color var(--ds-transition-duration-fast) var(--ds-ease-in-out);
  }
  .card:hover {
    background: color-mix(in srgb, var(--dsw-alias-label-primary) 1.5%, var(--kb-surface-card));
    border-color: var(--dsw-alias-border-l3);
  }
  .card.is-selected { border-color: var(--dsw-alias-border-l4); box-shadow: inset 2px 0 0 0 var(--kb-status-running); }
  .card.is-dragging { opacity: 0.45; }
  .card.is-drop-before { box-shadow: inset 0 2px 0 0 var(--kb-status-running); }
  .card[data-status="failed"] { border-color: color-mix(in srgb, var(--kb-status-failed) 26%, var(--dsw-alias-border-l2)); }

  .card-head { display: flex; align-items: flex-start; gap: 7px; }
  .card-head .dot { margin-top: 6px; }
  .card-title {
    flex: 1;
    min-width: 0;
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-s-strong-14);
    word-break: break-word;
  }
  .card-head .icon-btn { width: 22px; height: 22px; margin-top: -2px; }
  .card-head .icon-btn .ic { width: 14px; height: 14px; }
  .card-toggle { color: var(--dsw-alias-label-caption); }
  .card-menu { opacity: 0; }
  .card:hover .card-menu, .card:focus-within .card-menu { opacity: 1; }

  .card-summary {
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxs-12);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-action {
    display: flex;
    align-items: flex-start;
    gap: 5px;
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxs-12);
  }
  .card-action .ic { width: 13px; height: 13px; margin-top: 2px; color: var(--kb-agent-active); }
  .card-action.is-warn { color: var(--kb-status-needs-text); }
  .card-action.is-warn .ic { color: var(--kb-status-needs); }
  .card-action.is-error { color: var(--kb-status-failed); }
  .card-action.is-error .ic { color: var(--kb-status-failed); }
  .card-action.is-idle .ic { color: var(--dsw-alias-label-caption); }
  .card-action.is-idle { color: var(--dsw-alias-label-tertiary); }

  .card-props { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
  .priority {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 18px;
    padding: 0 6px;
    border-radius: 5px;
    font: var(--dsw-font-xxxs-strong-11);
    letter-spacing: 0.02em;
  }
  .priority[data-p="P0"] { background: color-mix(in srgb, var(--kb-status-failed) 12%, transparent); color: var(--kb-status-failed); }
  .priority[data-p="P1"] { background: color-mix(in srgb, var(--kb-status-needs) 14%, transparent); color: var(--kb-status-needs-text); }
  .priority[data-p="P2"] { background: color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent); color: var(--dsw-alias-label-tertiary); }
  .prop-project {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    max-width: 116px;
    overflow: hidden;
    color: var(--dsw-alias-label-tertiary);
    font: var(--dsw-font-xxxs-11);
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .prop-project .ic { width: 11px; height: 11px; }
  .tag {
    display: inline-flex;
    align-items: center;
    height: 18px;
    padding: 0 6px;
    border-radius: 5px;
    background: color-mix(in srgb, var(--dsw-alias-label-primary) 5%, transparent);
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxxs-11);
    white-space: nowrap;
  }

  .card-foot {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-top: 6px;
    border-top: 0.5px solid var(--dsw-alias-border-l1);
    color: var(--dsw-alias-label-tertiary);
    font: var(--dsw-font-xxxs-11);
    font-variant-numeric: tabular-nums;
  }
  .foot-status { display: inline-flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; }
  .foot-status[data-tone="backlog"] { color: var(--dsw-alias-label-tertiary); }
  .foot-status[data-tone="running"] { color: var(--kb-status-running); }
  .foot-status[data-tone="needs"] { color: var(--kb-status-needs-text); }
  .foot-status[data-tone="done"] { color: var(--kb-status-done); }
  .foot-status[data-tone="blocked"] { color: var(--kb-status-blocked); }
  .foot-status[data-tone="failed"] { color: var(--kb-status-failed); }
  .foot-metrics { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; }
  .metric { display: inline-flex; align-items: center; gap: 3px; color: var(--dsw-alias-label-tertiary); }
  .metric .ic { width: 12px; height: 12px; }
  .metric-link { padding: 0; border: 0; background: transparent; color: var(--dsw-alias-link); cursor: pointer; }
  .metric-link:hover { color: var(--dsw-alias-link); background: var(--dsw-alias-interactive-bg-hover); border-radius: 4px; }
  .metric-link .ic { width: 13px; height: 13px; }
  .divider-v { width: 0.5px; height: 10px; background: var(--dsw-alias-border-l2); }

  .dot {
    position: relative;
    width: 8px;
    height: 8px;
    flex: none;
    border-radius: 50%;
    corner-shape: round;
    background: var(--dsw-alias-label-caption);
    display: inline-block;
  }
  .dot-sm { width: 6px; height: 6px; }
  .dot[data-state="idle"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dsw-alias-label-caption); }
  .dot[data-state="ongoing"] { background: var(--kb-status-running); }
  .dot[data-state="ongoing"]::after {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    corner-shape: round;
    border: 1.5px solid var(--kb-status-running);
    opacity: 0.4;
    animation: dot-pulse 1.8s var(--ds-ease-in-out) infinite;
  }
  .dot[data-state="warning"] { background: var(--kb-status-needs); }
  .dot[data-state="done"] { background: var(--kb-status-done); }
  .dot[data-state="error"] { background: var(--kb-status-failed); }
  @keyframes dot-pulse {
    0% { transform: scale(0.8); opacity: 0.45; }
    70% { transform: scale(1.35); opacity: 0; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  /* ------------------------------------------------------------- decision */
  .decision {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    border-radius: 10px;
    background: var(--dsw-alias-state-warn-tertiary);
  }
  .decision-q { display: flex; align-items: flex-start; gap: 5px; color: var(--dsw-alias-label-primary); font: var(--dsw-font-xxs-strong-12); }
  .decision-q .ic { width: 14px; height: 14px; margin-top: 2px; color: var(--kb-status-needs); }
  .decision-risk { display: flex; align-items: flex-start; gap: 4px; color: var(--kb-status-needs-text); font: var(--dsw-font-xxxs-11); }
  .decision-risk .ic { width: 11px; height: 11px; margin-top: 1.5px; }
  .decision-actions { display: flex; justify-content: flex-end; gap: 6px; padding-top: 1px; }
  .decision-actions .btn { height: 30px; }
  .decision-note { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }

  /* -------------------------------------------------------------- timeline */
  .card-expanded {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 8px;
    border-top: 0.5px solid var(--dsw-alias-border-l1);
    cursor: default;
    animation: reveal var(--ds-transition-duration) var(--kb-ease-out);
  }
  .exp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    color: var(--dsw-alias-label-tertiary);
    font: var(--dsw-font-xxxs-strong-11);
    letter-spacing: 0.02em;
  }
  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--dsw-alias-link);
    font: var(--dsw-font-xxxs-strong-11);
    cursor: pointer;
  }
  .link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
  .link-btn .ic { width: 12px; height: 12px; }
  .timeline { list-style: none; padding: 0 0 0 16px; position: relative; display: flex; flex-direction: column; gap: 6px; }
  .timeline::before {
    content: "";
    position: absolute;
    left: 4.5px;
    top: 6px;
    bottom: 6px;
    width: 0.5px;
    background: var(--dsw-alias-border-l2);
  }
  .tl-node {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 1px 8px;
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxs-12);
  }
  .tl-node::before {
    content: "";
    position: absolute;
    left: -15px;
    top: 5.5px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    corner-shape: round;
    background: var(--dsw-alias-label-caption);
  }
  .tl-node[data-state="done"]::before { background: var(--kb-status-done); }
  .tl-node[data-state="current"]::before { background: var(--kb-status-running); box-shadow: 0 0 0 3px color-mix(in srgb, var(--kb-status-running) 18%, transparent); }
  .tl-node[data-state="pending"]::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--dsw-alias-label-caption); }
  .tl-node[data-state="error"]::before { background: var(--kb-status-failed); }
  .tl-node[data-state="current"] .tl-text { color: var(--dsw-alias-label-primary); font-weight: 500; }
  .tl-time { grid-column: 2; color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tl-detail { grid-column: 1 / -1; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }

  .reply {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 2px 2px 8px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 8px;
    background: var(--dsw-alias-bg-base);
  }
  .reply:focus-within { outline: 2px solid var(--dsw-alias-state-business-primary); outline-offset: 1px; }
  .reply input {
    flex: 1;
    min-width: 0;
    height: 26px;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xxs-12);
  }
  .reply input::placeholder { color: var(--dsw-alias-label-caption); }
  .reply-send { width: 24px; height: 24px; color: var(--dsw-alias-link); border-radius: 6px; }
  .reply-send .ic { width: 14px; height: 14px; }
  .reply-hint { color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }
  .reply-hint .ic { width: 10px; height: 10px; display: inline-block; vertical-align: -1px; }

  /* ---------------------------------------------------------------- empty */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin: 2px 0 4px;
    padding: 24px 12px;
    border: 1px dashed var(--dsw-alias-border-l2);
    border-radius: 10px;
    text-align: center;
  }
  .empty-icon {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    corner-shape: round;
    background: color-mix(in srgb, var(--dsw-alias-label-primary) 4%, transparent);
    color: var(--dsw-alias-label-caption);
  }
  .empty-title { color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxs-strong-12); }
  .empty-desc { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); max-width: 22em; }
  .empty .btn { margin-top: 2px; }

  .card-sk {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border-radius: var(--kb-r-card);
    border: 0.5px solid var(--dsw-alias-border-l1);
    background: var(--kb-surface-card);
  }
  .sk-line { height: 10px; border-radius: 4px; background: var(--dsw-alias-bg-skeleton); animation: sk-breathe 1.4s var(--ds-ease-in-out) infinite; }
  .sk-line.w-60 { width: 60%; }
  .sk-line.w-90 { width: 90%; }
  .sk-line.w-40 { width: 40%; }
  @keyframes sk-breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* ------------------------------------------------------------ list view */
  .list {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px var(--kb-pad-x) 24px;
  }
  .list-group { flex: none; border: 0.5px solid var(--dsw-alias-border-l2); border-radius: var(--kb-r-card); background: var(--kb-surface-card); overflow: hidden; }
  .list-group-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--dsw-alias-bg-module-platform);
  }
  .list-group-head .col-title { font: var(--dsw-font-xxs-strong-12); }
  .list-row { display: flex; flex-direction: column; }
  .list-row + .list-row { border-top: 0.5px solid var(--dsw-alias-border-l1); }
  .list-row-main {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: start;
    padding: 11px 12px;
    cursor: pointer;
  }
  .list-row-main:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .list-row-main .dot { margin-top: 6px; }
  .list-title { color: var(--dsw-alias-label-primary); font: var(--dsw-font-s-strong-14); }
  .list-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .list-summary { margin-top: 2px; color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxs-12); }
  .list-meta { display: flex; align-items: center; gap: 8px; flex: none; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); font-variant-numeric: tabular-nums; }
  .list-meta .btn { height: 26px; padding: 0 8px; }
  .list-meta .icon-btn { width: 24px; height: 24px; }
  .list-meta .ic { width: 13px; height: 13px; }
  .list-expanded {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px 12px 32px;
    border-top: 0.5px solid var(--dsw-alias-border-l1);
    animation: reveal var(--ds-transition-duration) var(--kb-ease-out);
  }
  .list-group.is-collapsed .list-row { display: none; }

  /* --------------------------------------------------------------- statusbar */
  .statusbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 var(--kb-pad-x);
    border-top: 0.5px solid var(--dsw-alias-border-l1);
    color: var(--dsw-alias-label-tertiary);
    font: var(--dsw-font-xxxs-11);
  }
  .statusbar .dot { width: 6px; height: 6px; color: var(--kb-status-done); }
  .statusbar-spacer { flex: 1; }
  .statusbar-mock { color: var(--dsw-alias-label-caption); }

  /* ---------------------------------------------------------------- popover */
  .popover {
    position: fixed;
    z-index: 70;
    min-width: 184px;
    max-width: calc(100vw - 24px);
    max-height: min(70dvh, 520px);
    overflow-y: auto;
    padding: 4px;
    border: 0;
    border-radius: 10px;
    background: var(--dsw-specific-menu);
    box-shadow: var(--dsw-elevation-panel);
    opacity: 0;
    transform: translateY(-3px);
    transition: opacity var(--ds-transition-duration-fast) var(--ds-ease-in-out), transform var(--ds-transition-duration-fast) var(--ds-ease-in-out);
  }
  .popover.is-open { opacity: 1; transform: none; }
  .menu-label { padding: 5px 8px 3px; color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-strong-11); letter-spacing: 0.04em; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xxs-12);
    text-align: left;
    cursor: pointer;
  }
  .menu-item:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .menu-item .ic { width: 14px; height: 14px; color: var(--dsw-alias-label-tertiary); }
  .menu-item.is-danger { color: var(--dsw-alias-state-error-primary); }
  .menu-item.is-danger .ic { color: var(--dsw-alias-state-error-primary); }
  .menu-item.is-danger:hover { background: var(--dsw-alias-interactive-bg-hover-danger); }
  .menu-hint { margin-left: auto; color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }
  .menu-sep { height: 0.5px; margin: 4px 0; background: var(--dsw-alias-border-l2); }
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 8px;
    border-radius: 6px;
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xxs-12);
    cursor: pointer;
  }
  .check:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .check input { width: 14px; height: 14px; margin: 0; accent-color: var(--dsw-alias-state-business-primary); }
  .help-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 4px 8px; color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxs-12); }
  .help-row .keys { display: inline-flex; gap: 3px; }
  .help-note { padding: 4px 8px 6px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); max-width: 250px; }

  /* ---------------------------------------------------------- scrim/drawer */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--dsw-alias-bg-mask-2);
    -webkit-backdrop-filter: var(--dsw-mask-blur);
    backdrop-filter: var(--dsw-mask-blur);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--ds-transition-duration) var(--ds-ease-in-out);
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 60;
    width: clamp(380px, 34vw, 460px);
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 0;
    background: var(--dsw-alias-bg-layer-1);
    box-shadow: var(--dsw-elevation-prominent);
    opacity: 0;
    transform: translateX(18px);
    pointer-events: none;
    transition: transform var(--ds-transition-duration-slow) var(--kb-ease-out), opacity var(--ds-transition-duration) var(--ds-ease-in-out);
  }
  .drawer.is-open { opacity: 1; transform: none; pointer-events: auto; }
  .drawer-grabber { display: none; }
  .drawer-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 12px 12px 0 16px; }
  .drawer-kicker { flex: 1; min-width: 0; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxs-12); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drawer-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 16px 16px; }
  .drawer-title-row { display: flex; align-items: flex-start; gap: 8px; }
  .drawer-title { flex: 1; min-width: 0; color: var(--dsw-alias-label-primary); font: var(--dsw-font-base-strong-16); word-break: break-word; }
  .drawer-title:focus { outline: none; }
  .drawer-title-input {
    flex: 1;
    min-width: 0;
    height: 34px;
    padding: 4px 8px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 8px;
    background: var(--dsw-specific-input-major);
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-base-strong-16);
  }
  .drawer-title-input:focus-visible { outline: 2px solid var(--dsw-alias-state-business-primary); outline-offset: 1px; }
  .drawer-summary { margin-top: 6px; color: var(--dsw-alias-label-secondary); font: var(--dsw-font-s-14); }
  .drawer-sub { margin-top: 8px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxs-12); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .drawer-sub .dot { width: 6px; height: 6px; }
  .attr-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 14px;
    margin: 14px 0 4px;
    padding: 12px;
    border-radius: 10px;
    background: var(--dsw-alias-bg-module-platform);
  }
  .attr { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .attr dt { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }
  .attr dd { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--dsw-alias-label-primary); font: var(--dsw-font-xxs-12); word-break: break-word; flex-wrap: wrap; }
  .attr dd .dot { width: 6px; height: 6px; }
  .attr .prop-project, .attr .tag { max-width: 100%; }

  .drawer-tabs { display: flex; align-items: center; gap: 2px; margin: 14px 0 8px; padding: 2px; border-radius: 9px; background: var(--dsw-specific-selector); }
  .drawer-tabs .seg-btn { flex: 1; justify-content: center; height: 28px; }
  .drawer-tab-count { color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }

  .sync-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 7px;
    background: var(--dsw-alias-state-business-tertiary);
    color: var(--dsw-alias-state-business-primary);
    font: var(--dsw-font-xxxs-strong-11);
  }
  .sync-bar .ic { width: 12px; height: 12px; }
  .sync-bar .sync-id { font: var(--dsw-font-markdown-code-block); color: var(--dsw-alias-state-business-primary); }
  .sync-bar .sync-state { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; }
  .sync-dot { width: 5px; height: 5px; border-radius: 50%; corner-shape: round; background: var(--kb-status-done); }

  .thread { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 4px; }
  .msg { display: flex; flex-direction: column; gap: 3px; max-width: 92%; }
  .msg-agent { align-self: flex-start; }
  .msg-you { align-self: flex-end; align-items: flex-end; }
  .msg-meta { color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }
  .msg-bubble {
    padding: 7px 10px;
    border-radius: 10px;
    background: var(--dsw-alias-bg-module-platform);
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xxs-12);
    word-break: break-word;
  }
  .msg-you .msg-bubble { background: var(--dsw-alias-state-business-tertiary); }
  .thread-empty { padding: 20px 8px; text-align: center; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxs-12); }

  .drawer-foot { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 10px 16px 14px; border-top: 0.5px solid var(--dsw-alias-border-l1); }
  .drawer-foot-row { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .drawer-foot-row .drawer-note { margin-right: auto; color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }
  .drawer-form { display: flex; flex-direction: column; gap: 2px; }
  .drawer-actions { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .drawer-actions .btn { height: 28px; padding: 0 10px; }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field > span { color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxs-strong-12); }
  .field input, .field textarea, .field select {
    width: 100%;
    min-height: 32px;
    padding: 6px 10px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 8px;
    background: var(--dsw-specific-input-major);
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xs-13);
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible { outline: 2px solid var(--dsw-alias-state-business-primary); outline-offset: 1px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1 1 0; min-width: 0; }
  .form-error { color: var(--dsw-alias-state-error-primary); font: var(--dsw-font-xxs-12); }

  /* ----------------------------------------------------------------- modal */
  .modal-layer {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--dsw-alias-bg-mask-3);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--ds-transition-duration) var(--ds-ease-in-out);
  }
  .modal-layer.is-open { opacity: 1; pointer-events: auto; }
  .modal {
    width: min(520px, 100%);
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    padding: 18px 20px 16px;
    border: 0;
    border-radius: 16px;
    background: var(--dsw-alias-bg-layer-1);
    box-shadow: var(--dsw-elevation-prominent);
    transform: translateY(8px) scale(0.99);
    transition: transform var(--ds-transition-duration) var(--kb-ease-out);
  }
  .modal-layer.is-open .modal { transform: none; }
  .modal-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
  .modal-head h2 { flex: 1; font: var(--dsw-font-base-strong-16); color: var(--dsw-alias-label-primary); }
  .modal-desc { margin: -8px 0 14px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxs-12); }
  .modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .modal-foot .modal-hint { margin-right: auto; color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }

  /* ----------------------------------------------------------------- toast */
  .toast-layer {
    position: fixed;
    left: 50%;
    top: 16px;
    z-index: 90;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .toast {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: min(480px, calc(100vw - 32px));
    padding: 9px 12px;
    border: 0;
    border-radius: 10px;
    background: var(--dsw-alias-button-primary-fill);
    color: var(--dsw-alias-label-primary-foreground);
    box-shadow: var(--dsw-elevation-panel);
    font: var(--dsw-font-xxs-12);
    animation: toast-in var(--ds-transition-duration) var(--kb-ease-out);
  }
  .toast .ic { width: 14px; height: 14px; }
  .toast-action {
    margin-left: 6px;
    padding: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font: var(--dsw-font-xxs-strong-12);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  @keyframes reveal { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: none; } }

  /* ------------------------------------------------------------- responsive */
  [data-layout="compact"] .board {
    --kb-gap: 12px;
    --kb-pad-x: 16px;
    grid-template-columns: repeat(4, minmax(240px, 1fr));
    padding-top: 14px;
  }
  [data-layout="compact"] .card-props .tag:nth-of-type(n+2) { display: none; }
  [data-layout="compact"] .col-en { display: none; }
  [data-layout="compact"] .statusbar { height: 28px; }
  [data-layout="compact"] .list-meta .list-project { display: none; }

  [data-layout="scroll"] .board {
    --kb-gap: 12px;
    --kb-pad-x: 16px;
    grid-template-columns: repeat(4, minmax(300px, 1fr));
    scroll-snap-type: x proximity;
    padding-top: 12px;
  }
  [data-layout="scroll"] .column { scroll-snap-align: start; }
  [data-layout="scroll"] .col-en { display: none; }
  [data-layout="scroll"] .statusbar { display: none; }
  [data-layout="scroll"] .list-meta .list-project { display: none; }
  [data-layout="scroll"] .filter-chips { display: none; }

  [data-layout="narrow"] .rail { display: none; }
  [data-layout="narrow"] .app { grid-template-columns: minmax(0, 1fr); }
  [data-layout="narrow"] .topbar { height: auto; min-height: 52px; padding: 8px 12px; gap: 8px; flex-wrap: nowrap; }
  [data-layout="narrow"] .crumb:first-child { display: none; }
  [data-layout="narrow"] .crumb-sep { display: none; }
  [data-layout="narrow"] .crumb-current { font: var(--dsw-font-s-strong-14); }
  [data-layout="narrow"] .crumb-tag { display: none; }
  [data-layout="narrow"] .topbar-actions { gap: 4px; }
  [data-layout="narrow"] .seg-btn { padding: 0 8px; height: 32px; }
  [data-layout="narrow"] .seg-btn .seg-label { display: none; }
  [data-layout="narrow"] .topbar .icon-btn { width: 36px; height: 36px; }
  [data-layout="narrow"] .new-btn { width: 40px; height: 40px; padding: 0; border-radius: 10px; }
  [data-layout="narrow"] .new-btn .btn-text { display: none; }
  [data-layout="narrow"] .toolbar { flex-wrap: wrap; padding: 8px 12px; gap: 6px; }
  [data-layout="narrow"] .search { width: 100%; height: 40px; order: -1; }
  [data-layout="narrow"] .search input { font: var(--dsw-font-s-14); }
  [data-layout="narrow"] .filter-btn { height: 36px; }
  [data-layout="narrow"] .filter-chips, [data-layout="narrow"] .toolbar-spacer { display: none; }
  [data-layout="narrow"] .session-live { margin-left: auto; }
  [data-layout="narrow"] .col-tabs { display: flex; }
  [data-layout="narrow"] .board { display: flex; flex-direction: column; padding: 10px 12px 12px; gap: 0; overflow: hidden; }
  [data-layout="narrow"] .column { display: none; flex: 1; min-height: 0; }
  [data-layout="narrow"] .column.is-active { display: flex; }
  [data-layout="narrow"] .column-body { padding: 0 8px 4px; gap: 10px; }
  [data-layout="narrow"] .card { padding: 12px 12px 10px; }
  [data-layout="narrow"] .card-menu { opacity: 1; }
  [data-layout="narrow"] .card-head .icon-btn { width: 30px; height: 30px; }
  [data-layout="narrow"] .card-summary { -webkit-line-clamp: 3; }
  [data-layout="narrow"] .decision-actions .btn { height: 40px; flex: 1; }
  [data-layout="narrow"] .column-add { height: 38px; }
  [data-layout="narrow"] .statusbar { display: none; }
  [data-layout="narrow"] .list { padding: 10px 12px 20px; gap: 10px; }
  [data-layout="narrow"] .list-row-main { grid-template-columns: 10px minmax(0, 1fr); gap: 8px; }
  [data-layout="narrow"] .list-meta { grid-column: 2; justify-content: flex-start; flex-wrap: wrap; margin-top: 4px; gap: 6px; }
  [data-layout="narrow"] .list-meta .list-project { display: inline; }
  [data-layout="narrow"] .list-expanded { padding-left: 26px; }
  [data-layout="narrow"] .drawer {
    top: auto;
    left: 0;
    right: 0;
    width: auto;
    min-height: 42dvh;
    max-height: 92dvh;
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
  }
  [data-layout="narrow"] .drawer.is-open { transform: none; }
  [data-layout="narrow"] .drawer-grabber {
    display: block;
    flex: none;
    width: 36px;
    height: 4px;
    margin: 8px auto 2px;
    border-radius: 99px;
    corner-shape: round;
    background: var(--dsw-alias-label-dimmed);
  }
  [data-layout="narrow"] .drawer-head { padding-top: 6px; }
  [data-layout="narrow"] .attr-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  [data-layout="narrow"] .drawer-foot-row .btn { min-height: 40px; }
  [data-layout="narrow"] .toast-layer { top: auto; bottom: 16px; }
  [data-layout="narrow"] .modal { border-radius: 16px; }
  [data-layout="narrow"] .modal-layer { align-items: end; padding: 0; }
  [data-layout="narrow"] .modal { width: 100%; border-radius: 16px 16px 0 0; max-height: 88dvh; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  [data-layout="narrow"] .help-btn { display: none; }
  [data-layout="narrow"] .drawer .attr-grid { gap: 9px 12px; }


  /* ============================================================ v2 增补 */
  /* 顶部：看板名 + 未归档/待确认/会话运行中计数 */
  .board-title { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
  .board-name { display: flex; align-items: center; gap: 8px; font: var(--dsw-font-s-strong-14); color: var(--dsw-alias-label-primary); white-space: nowrap; }
  .board-meta-sep { width: 0.5px; height: 12px; background: var(--dsw-alias-border-l2); }
  .board-metas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .board-meta { display: inline-flex; align-items: center; gap: 4px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); white-space: nowrap; }
  .board-meta .dot { width: 6px; height: 6px; }
  .board-meta strong { color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxxs-strong-11); font-variant-numeric: tabular-nums; }
  .board-meta + .board-meta::before { content: ""; width: 0.5px; height: 10px; margin-right: 4px; background: var(--dsw-alias-border-l2); }
  .board-meta--warn { color: var(--kb-status-needs-text); }
  .board-meta--live { color: var(--kb-status-running); }

  .session-live { display: inline-flex; align-items: center; gap: 6px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); white-space: nowrap; }
  .session-live .dot { color: var(--kb-agent-active); }
  .session-live strong { color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxxs-strong-11); }

  .group-control { display: inline-flex; align-items: center; }
  .group-select {
    height: 32px;
    padding: 0 8px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 8px;
    background: var(--dsw-specific-input-major);
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxs-strong-12);
  }
  .group-select:focus-visible { outline: 2px solid var(--dsw-alias-state-business-primary); outline-offset: 1px; }
  .toolbar-new { height: 32px; }

  .sync-error {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px var(--kb-pad-x);
    border-bottom: 0.5px solid color-mix(in srgb, var(--dsw-alias-state-error-primary) 24%, transparent);
    background: color-mix(in srgb, var(--dsw-alias-state-error-primary) 7%, var(--dsw-alias-bg-base));
    color: var(--dsw-alias-state-error-primary);
    font: var(--dsw-font-xxs-12);
  }
  .sync-error-icon { display: inline-flex; flex: none; }
  .sync-error-icon .ic { width: 14px; height: 14px; }
  .sync-error-text { flex: 1; min-width: 0; color: var(--dsw-alias-label-secondary); }
  .sync-error .btn { height: 26px; padding: 0 10px; flex: none; }
  .sync-error .icon-btn { width: 24px; height: 24px; flex: none; }

  /* 审批：所有选项 + 说明 + 备注（单选 / 多选） */
  .decision-title { flex: 1; min-width: 0; font: var(--dsw-font-xxs-strong-12); }
  .decision-meta { margin: -4px 0 0 19px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }
  .decision-options { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; border: 0; min-width: 0; }
  .opt {
    display: flex;
    align-items: flex-start;
    gap: 7px;
    padding: 6px 8px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 8px;
    background: var(--dsw-alias-bg-layer-1);
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xxs-12);
    cursor: pointer;
  }
  .opt:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .opt input { width: 13px; height: 13px; margin: 3px 0 0; flex: none; accent-color: var(--dsw-alias-state-business-primary); }
  .opt-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .opt-label { font: var(--dsw-font-xxs-strong-12); }
  .opt-desc { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }
  .opt.is-selected {
    border-color: color-mix(in srgb, var(--dsw-alias-state-business-primary) 42%, var(--dsw-alias-border-l2));
    background: color-mix(in srgb, var(--dsw-alias-state-business-primary) 5%, var(--dsw-alias-bg-layer-1));
  }
  .opt[data-tone="danger"] .opt-label { color: var(--dsw-alias-state-error-primary); }
  .decision-hint { color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }
  .approval-note {
    width: 100%;
    height: 30px;
    padding: 0 8px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 7px;
    background: var(--dsw-alias-bg-layer-1);
    color: var(--dsw-alias-label-primary);
    font: var(--dsw-font-xxs-12);
  }
  .approval-note:focus-visible { outline: 2px solid var(--dsw-alias-state-business-primary); outline-offset: 1px; }

  /* 已完成折叠 / 时间线加载更早 */
  .column-more { display: flex; justify-content: center; flex: none; padding: 4px 10px 0; }
  .column-more .btn { height: 26px; color: var(--dsw-alias-link); font: var(--dsw-font-xxxs-strong-11); }
  .timeline-more {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    align-self: flex-start;
    padding: 2px 0;
    border: 0;
    background: none;
    color: var(--dsw-alias-link);
    font: var(--dsw-font-xxxs-strong-11);
    cursor: pointer;
  }
  .timeline-more:hover { text-decoration: underline; text-underline-offset: 3px; }
  .card-expanded { max-height: 360px; overflow-y: auto; overscroll-behavior: contain; padding-right: 2px; }
  .list-expanded { max-height: 420px; overflow-y: auto; overscroll-behavior: contain; }

  /* 紧凑媒体行：缩略图 + 数量 + 在会话中查看 */
  .media-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border: 0.5px solid var(--dsw-alias-border-l1);
    border-radius: 8px;
    background: var(--dsw-alias-markdown-code-block);
    min-width: 0;
  }
  .media-thumbs { display: flex; gap: 3px; flex: none; }
  .media-thumb {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent);
    color: var(--dsw-alias-label-tertiary);
  }
  .media-thumb .ic { width: 13px; height: 13px; }
  .media-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .media-title { color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxxs-strong-11); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .media-sub { color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }
  .media-link { flex: none; padding: 0; border: 0; background: none; color: var(--dsw-alias-link); font: var(--dsw-font-xxxs-strong-11); cursor: pointer; white-space: nowrap; }
  .media-link:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* 多会话选择器 */
  .session-list { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
  .session-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 8px;
    background: var(--dsw-alias-bg-layer-1);
    min-width: 0;
  }
  .session-row.is-primary { border-color: var(--dsw-alias-border-l3); }
  .session-row .ic { width: 14px; height: 14px; color: var(--dsw-alias-label-tertiary); flex: none; }
  .session-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .session-name { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--dsw-alias-label-primary); font: var(--dsw-font-xxs-strong-12); }
  .session-name .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-id { color: var(--dsw-alias-label-caption); font: var(--dsw-font-markdown-code-block-small); }
  .session-meta { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }
  .session-badge {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    height: 17px;
    padding: 0 5px;
    border-radius: 5px;
    background: var(--dsw-alias-state-business-tertiary);
    color: var(--dsw-alias-state-business-primary);
    font: var(--dsw-font-xxxs-strong-11);
  }
  .session-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .session-actions .btn { height: 24px; padding: 0 6px; font: var(--dsw-font-xxxs-strong-11); }
  .reply-target { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }
  .reply-target select {
    height: 26px;
    max-width: 190px;
    padding: 0 4px;
    border: 0.5px solid var(--dsw-alias-border-l2);
    border-radius: 6px;
    background: var(--dsw-specific-input-major);
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxxs-11);
  }
  .composer-hint { margin-top: 4px; color: var(--dsw-alias-label-caption); font: var(--dsw-font-xxxs-11); }

  /* 列表：动作区固定宽度、右对齐；窄屏换行左对齐 */
  .row-actions { display: flex; align-items: center; gap: 4px; flex: none; }
  .row-actions .btn { width: 64px; height: 26px; padding: 0; font: var(--dsw-font-xxxs-strong-11); }
  .row-actions .btn--retry { width: 64px; }
  .list-done-fold {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-top: 0.5px solid var(--dsw-alias-border-l1);
    background: transparent;
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxs-12);
    text-align: left;
    cursor: pointer;
  }
  .list-done-fold:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .list-done-fold span { color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }
  .list-more { display: flex; justify-content: center; padding: 8px; border-top: 0.5px solid var(--dsw-alias-border-l1); }
  .list-more .btn { height: 28px; color: var(--dsw-alias-link); font: var(--dsw-font-xxxs-strong-11); }

  /* 新建卡片：项目 / 标签 / 执行上下文说明 */
  .form-explain {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin: 0 0 12px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--dsw-alias-bg-module-platform);
    color: var(--dsw-alias-label-secondary);
    font: var(--dsw-font-xxxs-11);
  }
  .form-explain strong { color: var(--dsw-alias-label-primary); font: var(--dsw-font-xxxs-strong-11); }
  .form-explain code { font: var(--dsw-font-markdown-code-block-small); color: var(--dsw-alias-label-secondary); }
  .form-inherit { display: flex; align-items: center; gap: 6px; color: var(--dsw-alias-label-tertiary); font: var(--dsw-font-xxxs-11); }
  .form-inherit .ic { width: 12px; height: 12px; }

  /* 脏草稿二次确认 */
  .confirm-backdrop { position: absolute; inset: 0; background: var(--dsw-alias-bg-mask-2); -webkit-backdrop-filter: var(--dsw-mask-blur); backdrop-filter: var(--dsw-mask-blur); }
  .confirm-layer { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; padding: 16px; }
  .confirm-modal {
    position: relative;
    width: min(420px, 100%);
    padding: 18px 20px 16px;
    border: 0;
    border-radius: 14px;
    background: var(--dsw-alias-bg-layer-1);
    box-shadow: var(--dsw-elevation-prominent);
  }
  .confirm-title { color: var(--dsw-alias-label-primary); font: var(--dsw-font-base-strong-16); }
  .confirm-desc { margin-top: 6px; color: var(--dsw-alias-label-secondary); font: var(--dsw-font-xxs-12); }
  .confirm-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* 审批编辑器 */
  .option-editor { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .option-editor-row { display: flex; align-items: center; gap: 8px; }
  .option-editor-row .tag { flex: none; }

  .tl-src {
    display: inline-flex;
    align-items: center;
    height: 15px;
    margin-left: 5px;
    padding: 0 4px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--dsw-alias-label-primary) 6%, transparent);
    color: var(--dsw-alias-label-caption);
    font: var(--dsw-font-xxxs-11);
    vertical-align: 1px;
    white-space: nowrap;
  }
  .muted { color: var(--dsw-alias-label-tertiary); }

  /* ===== v2 响应式增补 ===== */
  [data-layout="narrow"] .board-title { flex: 1; min-width: 0; }
  [data-layout="narrow"] .board-metas { gap: 6px; }
  [data-layout="narrow"] .board-meta { font: var(--dsw-font-xxxs-11); }
  [data-layout="narrow"] .session-live { display: none; }
  [data-layout="narrow"] .group-select { height: 36px; }
  [data-layout="narrow"] .toolbar-new { height: 40px; padding: 0 12px; }
  [data-layout="narrow"] .sync-error { flex-wrap: wrap; padding: 8px 12px; }
  [data-layout="narrow"] .sync-error-text { flex: 1 1 100%; order: 3; }
  [data-layout="narrow"] .card-expanded { max-height: 46dvh; }
  [data-layout="narrow"] .list-expanded { max-height: 46dvh; }
  [data-layout="narrow"] .row-actions { width: 100%; justify-content: flex-start; margin-top: 4px; }
  [data-layout="narrow"] .row-actions .btn { width: 72px; height: 32px; }
  [data-layout="narrow"] .session-row { flex-wrap: wrap; }
  [data-layout="narrow"] .session-actions { width: 100%; justify-content: flex-end; }
  [data-layout="compact"] .row-actions .btn { width: 56px; }
  [data-layout="scroll"] .row-actions .btn { width: 56px; }
  [data-layout="narrow"] .confirm-modal { width: 100%; border-radius: 16px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    .dot[data-state="ongoing"]::after { display: none; }
  }
</style>
</head>

<body>
<div class="app" id="app">
  <!-- DSH 侧栏窄条示意（真实宿主里由 shell 提供） -->
  <aside class="rail" aria-label="DSH 侧栏">
    <div class="rail-logo" aria-hidden="true">D</div>
    <button class="rail-btn" aria-label="对话" title="对话"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a7 7 0 0 1-7 7H8l-4 3v-6.5A7 7 0 0 1 11 5h2a7 7 0 0 1 7 7Z"/></svg></button>
    <button class="rail-btn is-active" aria-label="看板" title="看板"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="15" rx="2"/><rect x="13.5" y="4.5" width="7" height="15" rx="2"/></svg></button>
    <button class="rail-btn" aria-label="任务" title="任务"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></button>
    <button class="rail-btn" aria-label="设置" title="设置"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h8M18 7h2M4 17h2M10 17h10"/><circle cx="15" cy="7" r="2.2"/><circle cx="7" cy="17" r="2.2"/></svg></button>
    <div class="rail-spacer"></div>
    <div class="rail-avatar" title="jason" aria-hidden="true">J</div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <div class="board-title">
        <h1 class="board-name"><span id="boardName">看板</span><span class="board-meta-sep" aria-hidden="true"></span></h1>
        <div class="board-metas" id="boardMetas" aria-label="看板概览"></div>
      </div>
      <div class="topbar-actions">
        <div class="seg" role="tablist" aria-label="视图切换">
          <button type="button" class="seg-btn is-active" id="viewBoard" role="tab" aria-selected="true" data-action="view" data-view="board" aria-label="看板视图">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="15" rx="2"/><rect x="13.5" y="4.5" width="7" height="15" rx="2"/></svg>
            <span class="seg-label">看板</span>
          </button>
          <button type="button" class="seg-btn" id="viewList" role="tab" aria-selected="false" data-action="view" data-view="list" aria-label="列表视图">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1" fill="currentColor" stroke="none"/></svg>
            <span class="seg-label">列表</span>
          </button>
        </div>
        <button type="button" class="icon-btn" id="themeBtn" data-action="theme" aria-label="切换明暗主题" title="切换明暗主题（T）"></button>
        <button type="button" class="icon-btn help-btn" id="helpBtn" data-action="help" aria-label="键盘快捷键与帮助" title="快捷键（?）"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.5 2.2c-.7.3-1.1.9-1.1 1.7"/><circle cx="12" cy="17" r=".7" fill="currentColor" stroke="none"/></svg></button>
      </div>
    </header>

    <div class="toolbar">
      <label class="search" for="searchInput">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/></svg>
        <span class="sr-only">搜索卡片</span>
        <input id="searchInput" type="search" placeholder="搜索卡片、项目或标签…" autocomplete="off">
        <span class="kbd" aria-hidden="true">⌘K</span>
        <button type="button" class="icon-btn search-clear" id="searchClear" data-action="clear-search" aria-label="清除搜索" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </label>
      <button type="button" class="btn btn-secondary filter-btn" id="filterBtn" data-action="filter" aria-haspopup="dialog" aria-expanded="false">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        筛选
        <span class="filter-count" id="filterCount" hidden>0</span>
      </button>
      <div class="filter-chips" id="filterChips" aria-label="当前筛选条件"></div>
      <div class="toolbar-spacer"></div>
      <span class="session-live" id="sessionLive"></span>
      <label class="group-control" id="groupControl" hidden>
        <span class="sr-only">列表分组方式</span>
        <select class="group-select" id="groupSelect">
          <option value="status">按状态分组</option>
          <option value="project">按项目分组</option>
          <option value="priority">按优先级分组</option>
        </select>
      </label>
      <button type="button" class="btn btn-primary toolbar-new" id="listNewBtn" data-action="new-card" hidden>
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="btn-text">新建卡片</span>
      </button>
    </div>

    <div class="sync-error" id="syncError" role="alert" hidden>
      <span class="sync-error-icon" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 3.5 19h17L12 4Z"/><path d="M12 9v4.5"/><circle cx="12" cy="16.6" r=".7" fill="currentColor" stroke="none"/></svg></span>
      <span class="sync-error-text" id="syncErrorText">实时同步中断，看板可能不是最新；会话中的修改会在恢复后补上。</span>
      <button type="button" class="btn btn-secondary btn-sm" data-action="retry-sync">重试</button>
      <button type="button" class="icon-btn" data-action="dismiss-sync-error" aria-label="忽略实时同步错误">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>

    <div class="col-tabs" id="colTabs" role="tablist" aria-label="看板列切换"></div>

    <div class="board-wrap" id="boardWrap">
      <section class="board" id="board" aria-label="看板视图"></section>
      <section class="list" id="list" aria-label="列表视图" hidden></section>
    </div>

    <footer class="statusbar">
      <span class="dot" data-state="done" aria-hidden="true"></span>
      <span id="syncStatus">SSE 实时同步 · 最后更新刚刚</span>
      <span class="statusbar-spacer"></span>
      <span class="statusbar-mock" id="mockNote">演示数据 · 设计稿 v2</span>
      <span aria-hidden="true">·</span>
      <span><span class="kbd">⌘K</span> 搜索</span>
      <span><span class="kbd">N</span> 新建</span>
      <span><span class="kbd">?</span> 快捷键</span>
    </footer>
  </main>

  <!-- overlays（放在 .app 内以继承组件局部语义变量） -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
  <div id="popoverLayer"></div>
  <div class="modal-layer" id="modalLayer" hidden></div>
  <div class="confirm-layer" id="confirmLayer" hidden>
    <div class="confirm-backdrop" data-action="confirm-cancel"></div>
    <div class="confirm-modal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc" id="confirmModal"></div>
  </div>
  <div class="toast-layer" id="toastLayer" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>
</div>
