  function deleteCard(id) {
    const idx = cards.findIndex((c) => c.id === id);
    if (idx < 0) return;
    const backup = cards[idx];
    const wasDrawer = state.drawerId === id;
    if (wasDrawer) closeDrawer(true);
    cards.splice(idx, 1);
    state.expanded.delete(id);
    renderAll();
    toast('卡片已删除', {
      icon: 'trash',
      actionLabel: '撤销',
      onAction: function () {
        cards.splice(idx, 0, backup);
        renderAll({ focus: id });
        toast('已恢复卡片', { icon: 'redo' });
        announce('已恢复卡片' + backup.title);
      }
    });
    announce('已删除卡片' + backup.title);
  }
  function simulateAgent() {
    const backlogCard = cards.find((c) => c.col === 'backlog');
    const runningCard = cards.find((c) => c.col === 'running' && c.id !== 'c-203');
    if (backlogCard) {
      backlogCard.col = 'running'; backlogCard.status = 'running';
      backlogCard.action = 'Agent 自主领取 · 正在读取上下文';
      backlogCard.agent = backlogCard.agent === '待分配' ? 'Opus 5.5' : backlogCard.agent;
      backlogCard.nodes.push({ ago: '刚刚', text: 'Agent 自主领取任务（无需人工）', state: 'current' });
      backlogCard.updated = '刚刚';
      renderAll({ focus: backlogCard.id });
      toast('Agent 自主推进：' + backlogCard.title + ' → 进行中', { icon: 'sparkle' });
      announce('Agent 自主领取任务，卡片移到进行中');
      return;
    }
    if (runningCard) {
      runningCard.col = 'done'; runningCard.status = 'done';
      runningCard.action = '已完成 · 等待你查看结果';
      runningCard.nodes.push({ ago: '刚刚', text: '任务完成，Agent 自动归档到已完成', state: 'done' });
      runningCard.updated = '刚刚';
      renderAll({ focus: runningCard.id });
      toast('Agent 自主推进：' + runningCard.title + ' → 已完成', { icon: 'sparkle' });
      announce('Agent 完成任务，卡片移到已完成');
      return;
    }
    toast('没有可推进的卡片，先新建一张待办吧', { icon: 'alert' });
  }

  /* ----------------------------------------------------------------- menu */
  function positionPopover(el, anchor, align) {
    el.style.visibility = 'hidden';
    el.style.left = '0px';
    el.style.top = '0px';
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let left = align === 'end' ? r.right - w : r.left;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 12));
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.visibility = '';
  }
  function openPopover(kind, anchor, html, label) {
    closePopover();
    popoverLayer.innerHTML = '<div class="popover" role="dialog" aria-label="' + esc(label) + '">' + html + '</div>';
    const el = popoverLayer.firstElementChild;
    state.popover = { kind: kind, anchor: anchor, el: el };
    if (anchor.getAttribute('aria-haspopup')) anchor.setAttribute('aria-expanded', 'true');
    requestAnimationFrame(function () {
      positionPopover(el, anchor, kind === 'menu' ? 'end' : 'start');
      el.classList.add('is-open');
      const first = el.querySelector('button, input');
      if (first) first.focus({ preventScroll: true });
    });
  }
  function closePopover() {
    if (state.popover && state.popover.anchor) state.popover.anchor.setAttribute('aria-expanded', 'false');
    state.popover = null;
    popoverLayer.innerHTML = '';
  }

  function createCard(form) {
    const data = new FormData(form);

      if (err) err.hidden = false;
      const input = $('input[name="title"]', form);
      if (input) input.focus();
      return;
    }
    const colId = String(data.get('col') || 'backlog');
    const col = colById(colId);
    const card = {
      id: 'c-' + Math.floor(500 + Math.random() * 400),
      col: colId,
      title: title,
      status: col.defaultStatus,
      priority: String(data.get('priority') || 'P2'),
      project: String(data.get('project') || PROJECTS[0]),
      tags: String(data.get('tags') || '').split(/[,，、]/).map((s) => s.trim()).filter(Boolean).slice(0, 3),
      summary: String(data.get('summary') || '').trim() || '（未填写摘要）',
      action: col.defaultStatus === 'todo' ? '等待 Agent 领取' : col.defaultStatus === 'needs' ? '等待你确认' : '已创建 · 等待开始',
      tools: 0, searches: 0, elapsed: '—', updated: '刚刚', agent: '待分配', session: 'dsh-' + Math.random().toString(16).slice(2, 6),
      nodes: [{ ago: '刚刚', text: '由你在看板创建卡片', state: 'done' }, { ago: '—', text: '等待 Agent 领取', state: 'pending' }],
      thread: []
    };
    if (colId === 'needs') card.approval = { question: '确认是否开始：' + title + '？', risk: '由你创建，等待 Agent 确认范围' };
    const firstOfCol = cards.find((c) => c.col === colId);
    const idx = firstOfCol ? cards.indexOf(firstOfCol) : cards.length;
    cards.splice(idx, 0, card);
    state.expanded.add(card.id);
    if (state.layout === 'narrow') state.activeCol = colId;
    closeModal(true);
    renderAll({ focus: card.id });
    toast('卡片已创建 · 已同步到 DSH 会话', { icon: 'check' });
    announce('已创建卡片' + title);
  }
  function saveEdit(form) {
    const card = findCard(state.drawerId);
    if (!card) return;
    const data = new FormData(form);
    const title = String(data.get('title') || '').trim();
    if (!title) {
      const err = $('[data-edit-error]', form);
      if (err) err.hidden = false;
      return;
    }
    card.title = title;
    card.summary = String(data.get('summary') || '').trim();
    card.priority = String(data.get('priority') || card.priority);
    card.project = String(data.get('project') || card.project);
    card.tags = String(data.get('tags') || '').split(/[,，、]/).map((s) => s.trim()).filter(Boolean).slice(0, 3);
    const nextStatus = String(data.get('status') || card.status);
    if (nextStatus !== card.status) {
      const map = { todo: 'backlog', running: 'running', blocked: 'running', needs: 'needs', done: 'done', failed: 'done' };
      const nextCol = map[nextStatus];
      card.status = nextStatus;
      card.col = nextCol;
      if (nextStatus === 'needs' && !card.approval) card.approval = { question: '确认是否继续：' + title + '？', risk: '由看板编辑发起的人工确认' };
      if (nextStatus !== 'needs') card.approval = null;
      card.nodes.push({ ago: '刚刚', text: '你在详情中把状态改为「' + STATUS[nextStatus].label + '」', state: 'done' });
    }
    card.updated = '刚刚';
    state.editing = false;
    renderAll();
    renderDrawer();
    toast('修改已保存 · 已同步到 DSH 会话', { icon: 'check' });
    announce('已保存卡片修改');
  }

  /* ------------------------------------------------------------------ tabs */
  document.addEventListener('click', function (e) {
    const tab = e.target.closest('[data-action="view"]');
    if (tab) { setView(tab.dataset.view); return; }
  });

  /* --------------------------------------------------------------- delegation */
  function handleAction(e) {
    const btn = e.target.closest('[data-action]');
    if (!btn) return false;
    const action = btn.dataset.action;
    const id = btn.dataset.id;
    if (action === 'theme') { toggleTheme(); return true; }
    if (action === 'help') { openPopover('help', helpBtn, helpHTML(), '键盘快捷键'); return true; }
    if (action === 'filter') { openFilter(); return true; }
    if (action === 'new-card') { openNewModal('backlog'); return true; }
    if (action === 'add-col') { openNewModal(btn.dataset.col); return true; }
    if (action === 'clear-search') { state.search = ''; searchInput.value = ''; renderAll(); return true; }
    if (action === 'clear-filters') {
      state.filters.projects.clear(); state.filters.priorities.clear(); state.search = ''; searchInput.value = '';
      closePopover(); renderAll(); toast('已清除筛选条件', { icon: 'check' }); return true;
    }
    if (action === 'remove-project') { state.filters.projects.delete(btn.dataset.value); renderAll(); return true; }
    if (action === 'remove-priority') { state.filters.priorities.delete(btn.dataset.value); renderAll(); return true; }
    if (action === 'simulate') { simulateAgent(); return true; }
    if (action === 'refresh') { refreshBoard(); return true; }
    if (action === 'expand') { toggleExpand(id); return true; }
    if (action === 'open') { openDrawer(id); return true; }
    if (action === 'menu') { openCardMenu(id, btn); return true; }
    if (action === 'session') { openDrawer(id, 'thread'); return true; }
    if (action === 'collapse-col') {
      const colId = btn.dataset.col;
      if (state.collapsedCols.has(colId)) state.collapsedCols.delete(colId); else state.collapsedCols.add(colId);
      renderAll();
      announce((state.collapsedCols.has(colId) ? '已折叠' : '已展开') + colById(colId).name + '列');
      return true;
    }
    if (action === 'tab') { setActiveCol(btn.dataset.col); return true; }
    if (action === 'approve') { approveCard(id); return true; }
    if (action === 'reject') { rejectCard(id); return true; }
    if (action === 'retry') { retryCard(id); return true; }
    if (action === 'close-drawer') { closeDrawer(); return true; }
    if (action === 'edit') { state.editing = true; renderDrawer(); const input = drawer.querySelector('input[name="title"]'); if (input) input.focus(); return true; }
    if (action === 'cancel-edit') { state.editing = false; renderDrawer(); return true; }
    if (action === 'drawer-tab') { state.drawerTab = btn.dataset.tab; renderDrawer(); return true; }
    if (action === 'session-tab') { state.drawerTab = 'thread'; renderDrawer(); const input = $('#drawer [data-drawer-reply] input'); if (input) input.focus(); return true; }
    if (action === 'open-dsh') {
      const card = findCard(state.drawerId);
      toast('正在 DSH 会话中打开 ' + (card ? card.session : '') + '（演示）', { icon: 'link' });
      return true;
    }
    if (action === 'close-modal') { closeModal(); return true; }
    if (action === 'toast-undo') {
      if (state.toast && state.toast.onAction) state.toast.onAction();
      clearTimeout(state.toastTimer);
      toastLayer.innerHTML = '';
      return true;
    }
    return false;
  }

  document.addEventListener('click', function (e) {
    if (handleAction(e)) return;
    // 点击卡片 / 列表行：展开 / 收起（不含内部按钮、输入、链接）
    if (e.target.closest('button, a, input, textarea, select, label')) return;
    const cardEl = e.target.closest('.card, .list-row');
    if (cardEl && cardEl.dataset.cardId) toggleExpand(cardEl.dataset.cardId);
  });

  // 卡片菜单与筛选浮层
  popoverLayer.addEventListener('click', function (e) {
    const menu = e.target.closest('[data-menu]');
    if (menu) {
      const parts = menu.dataset.menu.split(':');
      const kind = parts[0]; const id = parts[1]; const value = parts[2];
      closePopover();
      if (kind === 'open') openDrawer(id);
      else if (kind === 'move') moveCard(id, value, null);
      else if (kind === 'copy') {
        const card = findCard(id);
        const text = 'dsh://session/' + (card ? card.session : '') + '#' + id;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () { toast('会话链接已复制', { icon: 'copy' }); }, function () { toast('会话链接：' + text, { icon: 'copy' }); });
        } else {
          toast('会话链接：' + text, { icon: 'copy' });
        }
      } else if (kind === 'delete') deleteCard(id);
      return;
    }
    if (e.target.closest('[data-filter-clear]')) {
      state.filters.projects.clear(); state.filters.priorities.clear();
      renderAll(); closePopover(); toast('已清除筛选条件', { icon: 'check' });
    }
  });
  popoverLayer.addEventListener('change', function (e) {
    const input = e.target.closest('[data-filter]');
    if (!input) return;
    const set = input.dataset.filter === 'project' ? state.filters.projects : state.filters.priorities;
    if (input.checked) set.add(input.value); else set.delete(input.value);
    renderBoard(); renderList(); renderTabs(); renderToolbar();
  });
  document.addEventListener('click', function (e) {
    if (!state.popover) return;
    if (e.target.closest('.popover')) return;
    if (e.target.closest('[data-action="filter"], [data-action="help"], [data-action="menu"]')) return;
    closePopover();
  });

  // 回复表单（卡片内 / 列表内 / 抽屉内）
  document.addEventListener('submit', function (e) {
    const replyForm = e.target.closest('[data-reply]');
    if (replyForm) {
      e.preventDefault();
      const input = replyForm.querySelector('input[name="reply"]');
      const value = input ? input.value : '';
      sendReply(replyForm.dataset.reply, value);
      return;
    }
    const drawerReply = e.target.closest('[data-drawer-reply]');
    if (drawerReply) {
      e.preventDefault();
      const input = drawerReply.querySelector('input[name="reply"]');
      sendReply(state.drawerId, input ? input.value : '');
      return;
    }
    const newForm = e.target.closest('[data-new-form]');
    if (newForm) { e.preventDefault(); createCard(newForm); return; }
    const editForm = e.target.closest('[data-edit-form]');
    if (editForm) { e.preventDefault(); saveEdit(editForm); return; }
  });

  // 搜索
  searchInput.addEventListener('input', function () {
    state.search = searchInput.value;
    renderBoard(); renderList(); renderTabs(); renderToolbar();
  });

  // 刷新（加载态演示）
  function refreshBoard() {
    if (state.refreshing) return;
    state.refreshing = true;
    renderBoard();
    toast('正在同步 Agent 状态…', { icon: 'refresh' });
    setTimeout(function () {
      state.refreshing = false;
      renderAll();
      toast('已同步 · ' + cards.length + ' 张卡片', { icon: 'check' });
      announce('看板已刷新');
    }, motionMs(900));
  }

  /* --------------------------------------------------------------- drawer UI */
  drawer.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    const focusables = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', drawer).filter(function (el) { return !el.disabled && el.offsetParent !== null; });
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  modalLayer.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    const focusables = $$('button, [href], input, select, textarea', modalLayer).filter(function (el) { return !el.disabled && el.offsetParent !== null; });
    if (!focusables.length) return;
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  scrim.addEventListener('click', function () { closeDrawer(); });

  /* ------------------------------------------------------------------- drag */
  let dragId = null;
  board.addEventListener('dragstart', function (e) {
    const cardEl = e.target.closest('.card');
    if (!cardEl) return;
    dragId = cardEl.dataset.cardId;
    cardEl.classList.add('is-dragging');
    board.classList.add('is-dragging');
    if (e.dataTransfer) {
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', dragId); } catch (err) { /* noop */ }
    }
  });
  board.addEventListener('dragend', function () {
    dragId = null;
    board.classList.remove('is-dragging');
    $$('.card.is-dragging, .card.is-drop-before', board).forEach(function (el) { el.classList.remove('is-dragging', 'is-drop-before'); });
    $$('.column.is-drop-target', board).forEach(function (el) { el.classList.remove('is-drop-target'); });
  });
  function clearDropHints() {
    $$('.card.is-drop-before', board).forEach(function (el) { el.classList.remove('is-drop-before'); });
    $$('.column.is-drop-target', board).forEach(function (el) { el.classList.remove('is-drop-target'); });
  }
  board.addEventListener('dragover', function (e) {
    if (!dragId) return;
    const colEl = e.target.closest('.column');
    if (!colEl) return;
    e.preventDefault();
    if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
    clearDropHints();
    colEl.classList.add('is-drop-target');
    if (colEl.classList.contains('is-collapsed')) return;
    const cardEls = $$('.card', colEl).filter(function (el) { return el.dataset.cardId !== dragId; });
    let before = null;
    for (let i = 0; i < cardEls.length; i += 1) {
      const r = cardEls[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { before = cardEls[i]; break; }
    }
    if (before) before.classList.add('is-drop-before');
  });
  board.addEventListener('drop', function (e) {
    if (!dragId) return;
    const colEl = e.target.closest('.column');
    if (!colEl) return;
    e.preventDefault();
    const colId = colEl.dataset.col;
    const cardEls = $$('.card', colEl).filter(function (el) { return el.dataset.cardId !== dragId; });
    let index = cardEls.length;
    for (let i = 0; i < cardEls.length; i += 1) {
      const r = cardEls[i].getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) { index = i; break; }
    }
    const id = dragId;
    dragId = null;
    clearDropHints();
    if (state.collapsedCols.has(colId)) state.collapsedCols.delete(colId);
    moveCard(id, colId, index);
  });

  /* -------------------------------------------------------------- keyboard */
  function closeTop() {
    if (state.popover) { closePopover(); return true; }
    if (!modalLayer.hidden) { closeModal(); return true; }
    if (state.drawerId) { closeDrawer(); return true; }
    return false;
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (closeTop()) e.preventDefault(); return; }
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const inField = /INPUT|TEXTAREA|SELECT/.test(tag) || (document.activeElement && document.activeElement.isContentEditable);
    const meta = e.metaKey || e.ctrlKey;
    if (meta && e.key.toLowerCase() === 'k') { e.preventDefault(); searchInput.focus(); searchInput.select(); return; }
    if (meta || e.altKey) {
      // Alt + 方向键：卡片换列 / 列内排序（见下方卡片处理）
      if (e.altKey) { /* fallthrough到卡片处理 */ }
      else return;
    }
    if (inField) return;
    const cardEl = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card, .list-row');
    if (cardEl && e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      e.preventDefault();
      const colId = cardEl.classList.contains('card')
        ? (cardEl.closest('.column') || {}).dataset && cardEl.closest('.column').dataset.col
        : (cardEl.closest('.list-group') || {}).dataset && cardEl.closest('.list-group').dataset.col;
      const idx = COLUMNS.findIndex(function (c) { return c.id === colId; });
      const next = COLUMNS[idx + (e.key === 'ArrowRight' ? 1 : -1)];
      if (next) moveCard(cardEl.dataset.cardId, next.id, null);
      return;
    }
    if (cardEl && e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault();
      const card = findCard(cardEl.dataset.cardId);
      if (!card) return;
      const colCards = cards.filter(function (c) { return c.col === card.col; });
      const cur = colCards.indexOf(card);
      const next = cur + (e.key === 'ArrowDown' ? 1 : -1);
      if (next >= 0 && next < colCards.length) moveCard(card.id, card.col, next);
      return;
    }
    if (cardEl && (e.key === 'Enter' || e.key === ' ')) {
      if (e.target.closest('button, a, input, textarea, select')) return;
      e.preventDefault(); toggleExpand(cardEl.dataset.cardId); return;
    }
    if (e.key === '/') { e.preventDefault(); searchInput.focus(); return; }
    if (e.key === '?') { e.preventDefault(); openPopover('help', helpBtn, helpHTML(), '键盘快捷键'); return; }
    const k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); openNewModal('backlog'); }
    else if (k === 'b') { e.preventDefault(); setView('board'); }
    else if (k === 'l') { e.preventDefault(); setView('list'); }
    else if (k === 't') { e.preventDefault(); toggleTheme(); }
    else if (k === 'o') {
      const el = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card, .list-row');
      if (el) { e.preventDefault(); openDrawer(el.dataset.cardId); }
    }
  });

  /* ------------------------------------------------------- resize / layout */
  const ro = new ResizeObserver(function (entries) {
    const w = entries[0].contentRect.width;
    const next = w < 720 ? 'narrow' : w < 1100 ? 'scroll' : w < 1440 ? 'compact' : 'wide';
    if (next === state.layout) return;
    state.layout = next;
    document.documentElement.dataset.layout = next;
    if (next === 'narrow' && !state.activeCol) state.activeCol = 'needs';
    renderAll();
  });
  ro.observe(app);

  /* ---------------------------------------------------------------- init */
  function init() {
    const params = new URLSearchParams(location.search);
    state.theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    state.layout = document.documentElement.dataset.layout || 'wide';
    if (params.get('view') === 'list') state.view = 'list';
    if (params.get('collapsed') === '1') state.expanded.clear();
    if (params.get('expanded')) {
      state.expanded.clear();
      params.get('expanded').split(',').forEach(function (id) { if (findCard(id)) state.expanded.add(id); });
    }
    if (params.get('col')) state.activeCol = params.get('col');
    renderAll();
    if (params.get('drawer')) {
      openDrawer(params.get('drawer'), params.get('tab') || 'nodes');
    }
    window.addEventListener('resize', function () { if (state.popover) closePopover(); });
  }

  // 顶部视图按钮的点击（复用统一 action）
  $('#viewBoard').addEventListener('click', function () { setView('board'); });
  $('#viewList').addEventListener('click', function () { setView('list'); });

  init();
})();
</script>
</body>
</html>
