        : '';
    return '<div class="list-row' + (selected ? ' is-selected' : '') + '" data-card-id="' + card.id + '" tabindex="0" role="group" aria-label="' + esc(card.title) + '，状态：' + esc(s.label) + '">' +
      '<div class="list-row-main" data-action="expand" data-id="' + card.id + '">' +
        dot(s.dot) +
        '<div class="list-main">' +
          '<div class="list-title-row"><span class="list-title">' + esc(card.title) + '</span>' +
            (pendingApproval ? '<span class="tag">待确认</span>' : '') + '</div>' +
          '<p class="list-summary">' + esc(card.summary) + '</p>' +
        '</div>' +
        '<div class="list-meta">' +
          priorityChip(card.priority) +
          '<span class="list-project">' + icon('folder') + esc(card.project) + '</span>' +
          statusFoot(card) +
          '<span class="metric" title="工具调用 ' + card.tools + ' 次">' + icon('tool') + card.tools + '</span>' +
          '<span class="metric" title="搜索 ' + card.searches + ' 次">' + icon('search') + card.searches + '</span>' +
          rowActions +
          '<button type="button" class="icon-btn" data-action="open" data-id="' + card.id + '" aria-label="打开详情：' + esc(card.title) + '">' + icon('chevronRight') + '</button>' +
          '<button type="button" class="icon-btn" data-action="menu" data-id="' + card.id + '" aria-label="卡片操作：' + esc(card.title) + '">' + icon('kebab') + '</button>' +
        '</div>' +
      '</div>' +
      (expanded ? '<div class="list-expanded">' +
        '<div class="exp-head"><span>重要节点</span><button type="button" class="link-btn" data-action="open" data-id="' + card.id + '">详情' + icon('chevronRight') + '</button></div>' +
        timelineHTML(card, { limit: 3 }) + mediaRowHTML(card) + decisionHTML(card) +
        (card.status === 'failed' ? '<button type="button" class="btn btn-secondary btn-sm" data-action="retry" data-id="' + card.id + '">' + icon('redo') + '重试任务</button>' : '') +
        replyHTML(card, 'list') + '</div>' : '') +
    '</div>';
  }

  function listGroupsData() {
    const visible = visibleCards();
    if (state.groupBy === 'status') {
      return COLUMNS.map((col) => ({
        key: 'col:' + col.id, id: col.id, title: col.name, en: col.en, icon: col.icon, tone: col.tone,
        cards: visible.filter((c) => c.col === col.id), isStatus: true, column: col.id
      }));
    }
    if (state.groupBy === 'project') {
      const extra = Array.from(new Set(visible.map((c) => c.project))).filter((p) => PROJECTS.indexOf(p) < 0);
      return PROJECTS.concat(extra).map((p) => ({
        key: 'project:' + p, id: p, title: '项目 · ' + p, en: '', icon: 'folder', tone: 'backlog',
        cards: visible.filter((c) => c.project === p), isStatus: false
      })).filter((g) => g.cards.length);
    }
    return ['P0', 'P1', 'P2'].map((p) => ({
      key: 'priority:' + p, id: p, title: p + ' · ' + (PRIORITY_LABEL[p] || ''), en: '', icon: 'circle', tone: p === 'P0' ? 'needs' : p === 'P1' ? 'running' : 'backlog',
      cards: visible.filter((c) => c.priority === p), isStatus: false
    })).filter((g) => g.cards.length);
  }

  function renderBoard() {
    board.innerHTML = COLUMNS.map(renderColumn).join('');
    board.hidden = state.view !== 'board';
    list.hidden = state.view !== 'list';
  }
  function renderList() {
    const groups = listGroupsData();
    list.innerHTML = groups.map((g) => {
      const isDone = g.isStatus && g.id === 'done';
      const collapsed = isDone ? !state.doneListExpanded : state.collapsedCols.has(g.key);
      const shown = isDone && state.doneListExpanded && !state.doneListAll ? g.cards.slice(0, 5) : g.cards;
      let body = '';
      if (isDone && !state.doneListExpanded) {
        body = '<button type="button" class="list-done-fold" data-action="done-list-toggle">展开已完成（' + g.cards.length + '）<span>默认只看最近 5 张</span></button>';
      } else if (!collapsed) {
        body = g.cards.length
          ? shown.map(renderListRow).join('') +
            (isDone && g.cards.length > 5
              ? '<div class="list-more"><button type="button" class="btn btn-ghost btn-sm" data-action="done-list-more">' +
                  (state.doneListAll ? '收起，只看最近 5 张' : '加载更多（剩余 ' + (g.cards.length - shown.length) + ' 张）') + '</button></div>'
              : '')
          : '<div class="empty" style="margin:12px">' +
              '<span class="empty-title">' + (isFiltering() ? '没有匹配的卡片' : '这一组还没有卡片') + '</span>' +
              '<span class="empty-desc">' + (isFiltering() ? '换个关键词，或清除筛选条件。' : '切换到看板视图，在列内新建卡片。') + '</span></div>';
      }
      const collapseAction = isDone ? 'done-list-toggle' : g.isStatus ? 'collapse-col' : 'collapse-group';
      const collapseAttr = isDone ? '' : (g.isStatus ? ' data-col="' + g.id + '"' : ' data-group="' + esc(g.key) + '"');
      return '<section class="list-group' + (collapsed && !isDone ? ' is-collapsed' : '') + '" data-group-key="' + esc(g.key) + '"' + (g.isStatus ? ' data-col="' + g.id + '"' : '') + ' aria-label="' + esc(g.title) + '分组，' + g.cards.length + ' 张卡片">' +
        '<header class="list-group-head">' +
          '<span class="col-icon">' + icon(g.icon) + '</span>' +
          '<h2 class="col-title">' + esc(g.title) + (g.en ? '<span class="col-en">' + g.en + '</span>' : '') + '</h2>' +
          '<span class="count-pill" title="' + g.cards.length + ' 张卡片">' + g.cards.length + '</span>' +
          '<span class="col-head-actions">' +
            '<button type="button" class="icon-btn" data-action="' + collapseAction + '"' + collapseAttr + ' aria-expanded="' + (!collapsed) + '" aria-label="' + (collapsed ? '展开' : '折叠') + esc(g.title) + '分组">' + icon(collapsed ? 'chevronRight' : 'chevronDown') + '</button>' +
          '</span>' +
        '</header>' +
        body +
      '</section>';
    }).join('');
    list.hidden = state.view !== 'list';
    board.hidden = state.view !== 'board';
  }

  function renderTabs() {
    colTabs.innerHTML = COLUMNS.map((col) => {
      const n = visibleCards().filter((c) => c.col === col.id).length;
      const active = state.activeCol === col.id;
      return '<button type="button" class="col-tab' + (active ? ' is-active' : '') + '" role="tab" aria-selected="' + active + '" data-action="tab" data-col="' + col.id + '">' +
        dot(col.tone === 'backlog' ? 'idle' : col.tone === 'running' ? 'ongoing' : col.tone === 'needs' ? 'warning' : 'done', true) +
        '<span>' + col.short + '</span><span class="col-tab-count">' + n + '</span></button>';
    }).join('');
  }

  function renderToolbar() {
    const active = countActiveFilters();
    $('#filterCount').hidden = !active;
    $('#filterCount').textContent = String(active);
    $('#searchClear').hidden = !state.search.trim();
    filterChips.innerHTML = '';
    state.filters.projects.forEach((p) => {
      filterChips.insertAdjacentHTML('beforeend', '<button type="button" class="filter-chip" data-action="remove-project" data-value="' + esc(p) + '" aria-label="移除项目筛选 ' + esc(p) + '">' + esc(p) + icon('x') + '</button>');
    });
    state.filters.priorities.forEach((p) => {
      filterChips.insertAdjacentHTML('beforeend', '<button type="button" class="filter-chip" data-action="remove-priority" data-value="' + p + '" aria-label="移除优先级筛选 ' + p + '">' + p + icon('x') + '</button>');
    });
    if (state.search.trim()) {
      filterChips.insertAdjacentHTML('beforeend', '<button type="button" class="filter-chip" data-action="clear-search" aria-label="清除搜索">搜索：' + esc(state.search.trim()) + icon('x') + '</button>');
    }
    const un = unarchived();
    const running = un.filter((c) => c.col === 'running').length;
    const needs = un.filter((c) => c.col === 'needs').length;
    const runningSessions = runningSessionsCount();
    sessionLive.innerHTML = '<span class="dot" data-state="ongoing" aria-hidden="true"></span><strong>' + runningSessions + '</strong> 个会话运行中 · SSE 实时';
    $('#viewBoard').classList.toggle('is-active', state.view === 'board');
    $('#viewList').classList.toggle('is-active', state.view === 'list');
    $('#viewBoard').setAttribute('aria-selected', String(state.view === 'board'));
    $('#viewList').setAttribute('aria-selected', String(state.view === 'list'));
    const themeBtn = $('#themeBtn');
    themeBtn.innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon');
    themeBtn.setAttribute('aria-pressed', String(state.theme === 'dark'));
    themeBtn.setAttribute('aria-label', state.theme === 'dark' ? '切换到亮色主题' : '切换到暗色主题');
    $('#syncStatus').textContent = state.syncError ? 'SSE 同步中断 · 可手动重试' : 'SSE 实时同步 · 最后更新刚刚';
    $('#syncStatus').parentElement.querySelector('.dot').dataset.state = state.syncError ? 'error' : 'done';
    boardMetas.innerHTML =
      '<span class="board-meta"><strong>' + un.length + '</strong> 张未归档卡片</span>' +
      '<span class="board-meta board-meta--warn">' + dot('warning', true) + '<strong>' + needs + '</strong> 待你确认</span>' +
      '<span class="board-meta board-meta--live">' + dot('ongoing', true) + '<strong>' + runningSessions + '</strong> 会话运行中</span>';
    groupControl.hidden = state.view !== 'list';
    listNewBtn.hidden = state.view !== 'list';
    groupSelect.value = state.groupBy;
    syncErrorBar.hidden = !state.syncError;
    $('#syncErrorText').textContent = state.syncRetrying
      ? '正在重新连接实时同步…'
      : '实时同步中断，看板可能不是最新；会话中的修改会在恢复后补上。';
  }

  function captureScroll() {
    const map = {};
    COLUMNS.forEach((col) => {
      const el = $('.column[data-col="' + col.id + '"] .column-body');
      if (el) map[col.id] = el.scrollTop;
    });
    return { cols: map, list: list.scrollTop };
  }
  function restoreScroll(snap) {
    COLUMNS.forEach((col) => {
      const el = $('.column[data-col="' + col.id + '"] .column-body');
      if (el && snap.cols[col.id] != null) el.scrollTop = snap.cols[col.id];
    });
    list.scrollTop = snap.list || 0;
  }
  function renderAll(opts) {
    const snap = captureScroll();
    renderBoard();
    renderList();
    renderTabs();
    renderToolbar();
    restoreScroll(snap);
    if (state.drawerId) renderDrawer();
    if (opts && opts.focus) {
      const el = $('.card[data-card-id="' + opts.focus + '"], .list-row[data-card-id="' + opts.focus + '"]');
      if (el) el.focus({ preventScroll: false });
    }
  }
  function focusCard(id) {
    const el = $('.card[data-card-id="' + id + '"], .list-row[data-card-id="' + id + '"]');
    if (el) el.focus({ preventScroll: false });
  }

  /* --------------------------------------------------------------- actions */
  function setView(view) {
    state.view = view;
    if (view === 'list' && state.layout === 'narrow') state.activeCol = 'needs';
    renderAll();
    announce(view === 'board' ? '已切换到看板视图' : '已切换到列表视图');
    searchInput.focus({ preventScroll: true });
  }
  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = state.theme;
    renderToolbar();
    announce(state.theme === 'dark' ? '已切换到暗色主题' : '已切换到亮色主题');
  }
  function toggleExpand(id) {
    if (state.expanded.has(id)) state.expanded.delete(id); else state.expanded.add(id);
    const card = findCard(id);
    renderBoard(); renderList();
    const el = $('.card[data-card-id="' + id + '"], .list-row[data-card-id="' + id + '"]');
    if (el) {
      const toggleBtn = el.querySelector('[data-action="expand"]');
      if (toggleBtn) toggleBtn.focus({ preventScroll: true });
    }
    announce((state.expanded.has(id) ? '已展开' : '已收起') + (card ? card.title : '卡片') + '的重要节点');
  }
  function setActiveCol(colId) {
    state.activeCol = colId;
    renderTabs();
    renderBoard();
    const col = colById(colId);
    if (col) announce('已切换到' + col.name + '列');
  }

  function defaultApproval(card) {
    return {
      title: '需要你确认：' + card.title,
      detail: '由你从看板发起的人工确认。默认选项可继续或停止；保存前可以修改问题与选项。',
      multiSelect: false,
      options: [
        { id: 'yes', label: '继续', description: '会话继续执行这张卡片。', tone: 'primary', outcome: 'running' },
        { id: 'no', label: '停止', description: '暂停执行，卡片回到待办。', tone: 'danger', outcome: 'backlog' }
      ]
    };
  }

  function moveCard(id, colId, index, opts) {
    const o = opts || {};
    const card = findCard(id);
    if (!card) return false;
    const from = card.col;
    if (from === colId && index == null) return false;
    const fromCol = colById(from);
    const toCol = colById(colId);
    const others = cards.filter((c) => c !== card);
    const colCards = others.filter((c) => c.col === colId);
    let insertAt;
    if (index == null || index >= colCards.length) {
      const last = colCards[colCards.length - 1];
      insertAt = last ? others.indexOf(last) + 1 : others.length;
    } else {
      insertAt = others.indexOf(colCards[index]);
    }
    if (from === colId && index == null) return false;
    card.col = colId;
    if (from !== colId) {
      card.status = toCol.defaultStatus;
      if (colId === 'needs') {
        card.approval = defaultApproval(card);
      } else {
        card.approval = null;
      }
      card.action = colId === 'backlog' ? '已回到待办 · 等待重新领取'
        : colId === 'running' ? '已被会话接收 · 正在执行'
        : colId === 'needs' ? '等待你确认'
        : '已完成 · 由看板移入';
      card.updated = '刚刚';
      card.nodes.push({ ago: '刚刚', text: '看板列变更：' + fromCol.name + ' → ' + toCol.name, state: 'done' });
    } else {
      card.nodes.push({ ago: '刚刚', text: '在看板中调整了顺序', state: 'done' });
    }
    others.splice(insertAt, 0, card);
    cards.length = 0;
    Array.prototype.push.apply(cards, others);
    renderAll({ focus: id });
    announce('卡片已移到' + toCol.name + (index != null ? '第 ' + (index + 1) + ' 位' : ''));
    toast('已移到「' + toCol.name + '」', { icon: 'check' });
    if (toCol.id === 'needs' && from !== 'needs' && o.human) {
      setTimeout(function () { openApprovalEditor(id); }, motionMs(120));
    }
    return true;
  }

  function applyApprovalOutcome(card, outcome) {
    const target = outcome === 'backlog' ? 'backlog' : outcome === 'done' ? 'done' : 'running';
    card.col = target;
    card.status = target === 'backlog' ? 'todo' : target === 'done' ? 'done' : 'running';
    card.action = target === 'backlog' ? '已停止 · 回到待办等待新方案'
      : target === 'done' ? '已完成 · 由审批结果触发'
      : '已收到你的决定 · 会话继续执行';
  }

  function resolveApproval(card, approved, selectedIds, note) {
    if (!card.approval) return;
    const a = card.approval;
    const ids = selectedIds && selectedIds.length ? selectedIds : [];
    const labels = ids.map(function (id) {
      const opt = a.options.find(function (x) { return x.id === id; });
      return opt ? opt.label : id;
    });
    const target = primarySession(card);
    const full = (approved ? '[审批] 提交选择：' : '[审批] 驳回：') + (labels.length ? labels.join('、') : '（未选择选项）') + (note ? '；备注：' + note : '');
    card.thread.push({ from: 'you', text: full, time: '刚刚', sessionId: target.id });
    card.nodes.push({
      ago: '刚刚',
      text: (approved ? '你提交了确认选择：' : '你驳回了确认请求：') + (labels.length ? labels.join('、') : '无选项') + (note ? ' · ' + note : ''),
      state: 'done'
    });
    card.updated = '刚刚';
    if (approved) {
      const chosen = a.options.find(function (x) { return x.id === ids[0]; }) || a.options[0];
      applyApprovalOutcome(card, chosen && chosen.outcome);
    } else {
      applyApprovalOutcome(card, 'backlog');
    }
    card.approval = null;
    delete state.approvalSel[card.id];
    delete state.approvalNotes[card.id];
    renderAll({ focus: card.id });
    toast(approved ? '已提交选择 · 会话收到你的决定' : '已驳回 · 卡片回到待办', { icon: approved ? 'check' : 'redo' });
    announce((approved ? '已提交选择：' : '已驳回：') + card.title);
  }

  function approveCard(id) {
    const card = findCard(id);
    if (!card || !card.approval) return;
    const sel = approvalSelection(card);
    if (card.approval.multiSelect && !sel.length) {
      toast('请至少选择 1 个选项', { icon: 'alert' });
      const first = document.querySelector('[data-approval-option="' + id + '"]');
      if (first) first.focus();
      return;
    }
    resolveApproval(card, true, sel, (state.approvalNotes[id] || '').trim());
  }

  function rejectCard(id) {
    const card = findCard(id);
    if (!card || !card.approval) return;
    const danger = card.approval.options.find(function (o) { return o.tone === 'danger'; }) || card.approval.options[card.approval.options.length - 1];
    resolveApproval(card, false, danger ? [danger.id] : [], (state.approvalNotes[id] || '').trim());
  }

  function retryCard(id) {
    const card = findCard(id);
    if (!card) return;
    card.col = 'running'; card.status = 'running';
    card.action = '正在重试 · 已跳过限流批次'; card.updated = '刚刚';
    card.nodes.push({ ago: '刚刚', text: '你点了重试，会话从第 215 条继续', state: 'current', source: 'session' });
    renderAll({ focus: id });
    toast('已重试 · 会话从断点继续', { icon: 'refresh' });
    announce('已重试' + card.title);
  }

  function sendReply(id, text) {
    const card = findCard(id);
    const value = (text || '').trim();
    if (!card || !value) return;
    const targetId = state.replyTarget[id] || primarySession(card).id;
    const targetTitle = sessionTitle(card, targetId);
    card.thread.push({ from: 'you', text: value, time: '刚刚', sessionId: targetId });
    const summary = value.length > 42 ? value.slice(0, 42) + '…' : value;
    card.nodes.push({ ago: '刚刚', text: '你回复了会话：' + summary, state: 'done' });
    card.updated = '刚刚';
    if (card.status === 'needs' && !card.approval) {
      card.col = 'running'; card.status = 'running';
      card.action = '已收到你的讨论回复，会话继续执行';
      card.nodes.push({ ago: '刚刚', text: '讨论结束，会话继续执行', state: 'current', source: 'session' });
      toast('已发送到「' + targetTitle + '」· 卡片移到进行中', { icon: 'send' });
      announce('回复已发送，卡片自动移到进行中');
    } else {
      card.action = '已收到你的回复，会话继续执行';
      toast('已发送到「' + targetTitle + '」', { icon: 'send' });
      announce('回复已发送到会话');
    }
    renderAll({ focus: id });
    if (state.drawerId === id) {
      state.drawerTab = 'thread';
      renderDrawer();
      const input = $('#drawer [data-drawer-reply] input');
      if (input) input.focus({ preventScroll: true });
    }
  }

  function archiveCard(id) {
    const idx = cards.findIndex((c) => c.id === id);
    if (idx < 0) return;
    const backup = cards[idx];
    if (state.drawerId === id) closeDrawer(true);
    cards.splice(idx, 1);
    state.expanded.delete(id);
    renderAll();
    toast('卡片已归档', {
      icon: 'archive',
      actionLabel: '撤销',
      onAction: function () {
        cards.splice(idx, 0, backup);
        renderAll({ focus: id });
        toast('已恢复卡片', { icon: 'redo' });
        announce('已恢复卡片' + backup.title);
      }
    });
    announce('已归档卡片' + backup.title);
  }

  function setPrimarySession(cardId, sessionId) {
    const card = findCard(cardId);
    if (!card) return;
    if (!card.sessions || !card.sessions.length) return;
    card.sessions = card.sessions.map(function (x) { return Object.assign({}, x, { primary: x.id === sessionId }); });
    const first = card.sessions.find(function (x) { return x.primary; });
    if (first) {
      card.sessions = [first].concat(card.sessions.filter(function (x) { return x !== first; }));
      card.session = first.id;
    }
    renderAll();
    toast('已设为主会话', { icon: 'check' });
    announce('已设为' + sessionTitle(card, sessionId) + '主会话');
  }

  function setReplyTarget(cardId, sessionId) {
    state.replyTarget[cardId] = sessionId;
    renderDrawer();
  }

  function toggleDoneAll() {
    state.doneAll = !state.doneAll;
    renderBoard();
    announce(state.doneAll ? '已展开全部已完成卡片' : '已完成列只显示最近 5 张');
  }

  function toggleDoneList() {
    state.doneListExpanded = !state.doneListExpanded;
    if (!state.doneListExpanded) state.doneListAll = false;
    renderList();
    announce(state.doneListExpanded ? '已展开已完成分组' : '已折叠已完成分组');
  }

  function loadMoreDone() {
    state.doneListAll = !state.doneListAll;
    renderList();
    announce(state.doneListAll ? '已加载全部已完成卡片' : '只显示最近 5 张已完成卡片');
  }

  function setGroupBy(value) {
    if (!value) return;
    state.groupBy = value;
    renderList(); renderToolbar();
    announce('列表已按' + (value === 'project' ? '项目' : value === 'priority' ? '优先级' : '状态') + '分组');
  }

  function retrySync() {
    if (state.syncRetrying) return;
    state.syncRetrying = true;
    renderToolbar();
    setTimeout(function () {
      state.syncRetrying = false;
      state.syncError = false;
      renderToolbar();

  function positionPopover(el, anchor, align) {
    el.style.visibility = 'hidden';
    el.style.left = '0px';
    el.style.top = '0px';
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    let left = align === 'end' ? r.right - w : r.left;
    left = Math.max(8, Math.min(left, window.innerWidth - w - 12));
    let top = r.bottom + 6;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    el.style.visibility = '';
  }

    state.popover = { kind: kind, anchor: anchor, el: el };
    if (anchor.getAttribute('aria-haspopup')) anchor.setAttribute('aria-expanded', 'true');
    requestAnimationFrame(function () {
      positionPopover(el, anchor, kind === 'menu' ? 'end' : 'start');
      el.classList.add('is-open');
      const first = el.querySelector('button, input');
      if (first) first.focus({ preventScroll: true });
    });

    if (e.key === '/') { e.preventDefault(); searchInput.focus(); return; }
    if (e.key === '?') { e.preventDefault(); openPopover('help', helpBtn, helpHTML(), '键盘快捷键'); return; }
    const k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); openNewModal('backlog'); }
    else if (k === 'b') { e.preventDefault(); setView('board'); }
    else if (k === 'l') { e.preventDefault(); setView('list'); }
    else if (k === 't') { e.preventDefault(); toggleTheme(); }
    else if (k === 'o') {
      const el = document.activeElement && document.activeElement.closest && document.activeElement.closest('.card, .list-row');
      if (el) { e.preventDefault(); openDrawer(el.dataset.cardId); }
    }
  });

  /* ------------------------------------------------------- resize / layout */
  const ro = new ResizeObserver(function (entries) {
    const w = entries[0].contentRect.width;
    const next = w < 720 ? 'narrow' : w < 1100 ? 'scroll' : w < 1440 ? 'compact' : 'wide';
    if (next === state.layout) return;
    state.layout = next;
    document.documentElement.dataset.layout = next;
    if (next === 'narrow' && !state.activeCol) state.activeCol = 'needs';
    renderAll();
  });
  ro.observe(app);

  /* ---------------------------------------------------------------- init */
  function init() {
    const params = new URLSearchParams(location.search);
    state.theme = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    state.layout = document.documentElement.dataset.layout || 'wide';
    if (params.get('view') === 'list') state.view = 'list';
    if (params.get('group')) state.groupBy = params.get('group');
    if (params.get('collapsed') === '1') state.expanded.clear();
    if (params.get('expanded')) {
      state.expanded.clear();
      params.get('expanded').split(',').forEach(function (id) { if (findCard(id)) state.expanded.add(id); });
    }
    if (params.get('done') === 'all') state.doneAll = true;
    if (params.get('listDone') === 'expanded') state.doneListExpanded = true;
    if (params.get('listDone') === 'all') { state.doneListExpanded = true; state.doneListAll = true; }
    if (params.get('multi') === '1') { state.expanded.clear(); state.expanded.add('c-304'); }
    if (params.get('syncError') === '1') state.syncError = true;
    if (params.get('col')) state.activeCol = params.get('col');
    renderAll();
    if (params.get('drawer')) {
      openDrawer(params.get('drawer'), params.get('tab') || 'nodes');
    } else if (params.get('sessions') === '1') {
      openDrawer('c-201', 'thread');
    }
    const firstExpanded = params.get('multi') === '1' || params.get('expanded') ? Array.from(state.expanded)[0] : null;
    if (firstExpanded) {
      setTimeout(function () {
        const el = document.querySelector('.card[data-card-id="' + firstExpanded + '"]');
        if (el) el.scrollIntoView({ block: 'center' });
      }, motionMs(80));
    }
    window.addEventListener('resize', function () { if (state.popover) closePopover(); });
  }

  // 顶部视图按钮的点击（复用统一 action）
  $('#viewBoard').addEventListener('click', function () { setView('board'); });
  $('#viewList').addEventListener('click', function () { setView('list'); });

  init();
})();

</script>
</body>
</html>
